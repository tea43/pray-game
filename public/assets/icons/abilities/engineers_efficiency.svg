<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gear outer ring with teeth -->
  <circle cx="32" cy="32" r="16" stroke="#c8b890" stroke-width="2"/>
  <!-- Gear teeth (8 teeth) -->
  <rect x="28" y="10" width="8" height="6" rx="1" stroke="#c8b890" stroke-width="2"/>
  <rect x="28" y="48" width="8" height="6" rx="1" stroke="#c8b890" stroke-width="2"/>
  <rect x="10" y="28" width="6" height="8" rx="1" stroke="#c8b890" stroke-width="2"/>
  <rect x="48" y="28" width="6" height="8" rx="1" stroke="#c8b890" stroke-width="2"/>
  <!-- Diagonal teeth -->
  <rect x="13" y="13" width="6" height="6" rx="1" transform="rotate(45 16 16)" stroke="#c8b890" stroke-width="2"/>
  <rect x="45" y="13" width="6" height="6" rx="1" transform="rotate(45 48 16)" stroke="#c8b890" stroke-width="2"/>
  <rect x="13" y="45" width="6" height="6" rx="1" transform="rotate(45 16 48)" stroke="#c8b890" stroke-width="2"/>
  <rect x="45" y="45" width="6" height="6" rx="1" transform="rotate(45 48 48)" stroke="#c8b890" stroke-width="2"/>
  <!-- Center hole -->
  <circle cx="32" cy="32" r="6" stroke="#c8b890" stroke-width="2"/>
</svg>
