<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fist / knuckle base -->
  <rect x="14" y="30" width="36" height="22" rx="4" stroke="#c8b890" stroke-width="2"/>
  <!-- Finger knuckles (four bumps on top) -->
  <rect x="16" y="22" width="8" height="10" rx="3" stroke="#c8b890" stroke-width="2"/>
  <rect x="26" y="20" width="8" height="12" rx="3" stroke="#c8b890" stroke-width="2"/>
  <rect x="36" y="21" width="8" height="11" rx="3" stroke="#c8b890" stroke-width="2"/>
  <!-- Thumb bump on side -->
  <ellipse cx="14" cy="40" rx="5" ry="7" stroke="#c8b890" stroke-width="2"/>
  <!-- Knuckle detail lines -->
  <line x1="20" y1="36" x2="20" y2="50" stroke="#c8b890" stroke-width="1" opacity="0.5"/>
  <line x1="30" y1="36" x2="30" y2="50" stroke="#c8b890" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="36" x2="40" y2="50" stroke="#c8b890" stroke-width="1" opacity="0.5"/>
</svg>
