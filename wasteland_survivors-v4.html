    this.vy = Math.sin(angle) * speed;
    this.maxRange = 320;
    this.dmg = dmg;
    this.dead = false;
    this.r = 3;
  }
  update(dt) {
    if (this.dead) return;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    if (Math.hypot(this.x - this.startX, this.y - this.startY) > this.maxRange) { this.dead = true; return; }
    if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > PLAY_BOTTOM + 10) { this.dead = true; return; }
    for (const e of state.enemies) {
      if (e.dead) continue;
      if (dist2(this.x, this.y, e.x, e.y) < e.r + this.r) {
        e.hp -= this.dmg;
        e.hurtFlash = 1;
        e.knockX += this.vx * 0.18;
        e.knockY += this.vy * 0.18;
        for (let i = 0; i < 5; i++) {
          state.particles.push({
            x: e.x + rand(-2, 2), y: e.y + rand(-2, 2),
            vx: rand(-60, 60), vy: rand(-80, -10),
            life: rand(0.2, 0.5), maxLife: 0.5,
            color: e.bloodColor, size: rand(1, 2), realtime: true,
          });
        }
        this.dead = true;
        return;
      }
    }
  }
  draw(ctx) {
    if (this.dead) return;
    ctx.strokeStyle = 'rgba(255, 200, 80, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(this.x - this.vx * 0.018, this.y - this.vy * 0.018);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();
    ctx.fillStyle = '#fff8c0';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ==================== LOOT ====================
class Loot {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.type = type;
    this.bob = rand(0, Math.PI * 2);
    this.spawnTime = 0;
    this.picked = false;
    this.r = 9;
  }
  update(dt) {
    this.bob += dt * 2.5;
    this.spawnTime += dt;
  }
  draw(ctx) {
    if (this.picked) return;
    const yOff = Math.sin(this.bob) * 1.6;
    const popIn = Math.min(1, this.spawnTime * 5);
    const easedPop = 1 - Math.pow(1 - popIn, 3);

    // ground shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + 7, 7 * easedPop, 2.4 * easedPop, 0, 0, Math.PI * 2);
    ctx.fill();

    // glow halo
    const glowColor = this.type === 'medkit'       ? 'rgba(255, 90, 80, 0.22)'
                    : this.type === 'stimpack'      ? 'rgba(80, 240, 130, 0.22)'
                    : this.type === 'spray_gun'     ? 'rgba(255, 160, 40, 0.35)'
                    : this.type === 'samurai_sword' ? 'rgba(220, 220, 80, 0.35)'
                    : this.type === 'banana_bomb'   ? 'rgba(200, 240, 60, 0.4)'
                    : 'rgba(255, 170, 60, 0.28)';
    const haloR = (12 + Math.sin(this.bob * 1.5) * 2.5) * easedPop;
    ctx.fillStyle = glowColor;
    ctx.beginPath();
    ctx.arc(this.x, this.y + yOff, haloR, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(this.x, this.y + yOff);
    ctx.scale(easedPop, easedPop);

    if (this.type === 'medkit') {
      ctx.fillStyle = '#e8e0c8';
      ctx.fillRect(-6, -5, 12, 10);
      ctx.strokeStyle = '#1a0f06';
      ctx.lineWidth = 0.9;
      ctx.strokeRect(-6, -5, 12, 10);
      // metal corners
      ctx.fillStyle = '#5a4a30';
      ctx.fillRect(-6, -5, 2, 1.4);
      ctx.fillRect(4, -5, 2, 1.4);
      ctx.fillRect(-6, 3.6, 2, 1.4);
      ctx.fillRect(4, 3.6, 2, 1.4);
      // red cross
      ctx.fillStyle = '#c53030';
      ctx.fillRect(-1.3, -3.5, 2.6, 7);
      ctx.fillRect(-3.5, -1.3, 7, 2.6);
      ctx.strokeStyle = '#5a1010';
      ctx.lineWidth = 0.4;
      ctx.strokeRect(-1.3, -3.5, 2.6, 7);
      ctx.strokeRect(-3.5, -1.3, 7, 2.6);
    } else if (this.type === 'stimpack') {
      // body
      ctx.fillStyle = '#d8d4c0';
      ctx.fillRect(-5, -2.2, 9, 4.4);
      ctx.strokeStyle = '#1a0f06';
      ctx.lineWidth = 0.7;
      ctx.strokeRect(-5, -2.2, 9, 4.4);
      // green liquid
      ctx.fillStyle = '#2faa48';
      ctx.fillRect(-4, -1.6, 6.5, 3.2);
      ctx.fillStyle = '#5fd06a';
      ctx.fillRect(-4, -1.6, 6.5, 1);
      // plunger
      ctx.fillStyle = '#1a0f06';
      ctx.fillRect(-7.5, -2.8, 2.5, 5.6);
      ctx.fillStyle = '#5a3a25';
      ctx.fillRect(-7, -2.4, 1.5, 4.8);
      // needle
      ctx.strokeStyle = '#9a9aa0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(4, 0); ctx.lineTo(8.5, 0);
      ctx.stroke();
    } else if (this.type === 'bomb') {
      // dark sphere body
      ctx.fillStyle = '#1a1a22';
      ctx.beginPath();
      ctx.arc(0, 1, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0a0608';
      ctx.lineWidth = 1;
      ctx.stroke();
      // highlight
      ctx.fillStyle = 'rgba(160, 150, 170, 0.55)';
      ctx.beginPath();
      ctx.arc(-2, -1, 1.8, 0, Math.PI * 2);
      ctx.fill();
      // fuse cap
      ctx.fillStyle = '#2a2a30';
      ctx.fillRect(-1.5, -6, 3, 1.5);
      // fuse curl
      ctx.strokeStyle = '#5a4a30';
      ctx.lineWidth = 1.3;
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.quadraticCurveTo(3.5, -8.5, 5.5, -7);
      ctx.stroke();
      // spark crackle
      const sparkPhase = (this.bob * 4) % 1;
      ctx.fillStyle = '#ffe070';
      ctx.beginPath();
      ctx.arc(5.5, -7, 1.6 + sparkPhase * 0.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffa040';
      ctx.beginPath();
      ctx.arc(5.5, -7, 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff8d0';
      ctx.beginPath();
      ctx.arc(5.5, -7, 0.4, 0, Math.PI * 2);
      ctx.fill();
    } else if (this.type === 'spray_gun') {
      // gun body
      ctx.fillStyle = '#3a3a4a';
      ctx.fillRect(-7, -2.5, 13, 5);
      ctx.strokeStyle = '#1a1a28';
      ctx.lineWidth = 0.7;
      ctx.strokeRect(-7, -2.5, 13, 5);
      // barrel
      ctx.fillStyle = '#5a5a6a';
      ctx.fillRect(3, -1.2, 6, 2.4);
      // grip
      ctx.fillStyle = '#2a2020';
      ctx.fillRect(-5, 2.5, 3.5, 4.5);
      ctx.strokeStyle = '#1a1010';
      ctx.lineWidth = 0.5;
      ctx.strokeRect(-5, 2.5, 3.5, 4.5);
      // muzzle dots (spray hint)
      ctx.fillStyle = '#ffcc40';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(9.5, -2 + i * 2, 0.8, 0, Math.PI * 2);
        ctx.fill();
      }
      // trigger
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-1, 2.5); ctx.lineTo(1, 4.5);
      ctx.stroke();
    } else if (this.type === 'samurai_sword') {
      // blade
      ctx.strokeStyle = '#d8e8f0';
      ctx.lineWidth = 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-8, 0); ctx.lineTo(8, 0);
      ctx.stroke();
      // edge highlight
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(-8, -0.8); ctx.lineTo(8, -0.8);
      ctx.stroke();
      // guard
      ctx.fillStyle = '#c8a040';
      ctx.fillRect(-2, -3, 4, 6);
      ctx.strokeStyle = '#8a6820';
      ctx.lineWidth = 0.6;
      ctx.strokeRect(-2, -3, 4, 6);
      // grip
      ctx.fillStyle = '#2a1a0a';
      ctx.fillRect(-8, -1.5, 5, 3);
      // wrap lines
      ctx.strokeStyle = '#5a3a15';
      ctx.lineWidth = 0.6;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-7 + i * 1.5, -1.5); ctx.lineTo(-7 + i * 1.5, 1.5);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
      // tip
      ctx.fillStyle = '#e0eef8';
      ctx.beginPath();
      ctx.moveTo(8, 0); ctx.lineTo(11, -1.5); ctx.lineTo(11, 1.5);
      ctx.closePath(); ctx.fill();
    } else if (this.type === 'banana_bomb') {
      // banana shape (curved body)
      ctx.strokeStyle = '#e8d820';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-6, 3);
      ctx.quadraticCurveTo(0, -9, 7, 2);
      ctx.stroke();
      // highlight
      ctx.strokeStyle = '#fff8a0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-5, 2);
      ctx.quadraticCurveTo(0, -7, 6, 1);
      ctx.stroke();
      // tip dots
      ctx.fillStyle = '#8a7010';
      ctx.beginPath(); ctx.arc(-6, 3, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, 2, 1.5, 0, Math.PI * 2); ctx.fill();
      // fuse
      ctx.strokeStyle = '#5a4a30';
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(1, -6);
      ctx.quadraticCurveTo(4, -10, 6, -8);
      ctx.stroke();
      // spark
      const bSpark = (this.bob * 3.5) % 1;
      ctx.fillStyle = '#ffe070';
      ctx.beginPath();
      ctx.arc(6, -8, 1.4 + bSpark * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineCap = 'butt';
    }

    ctx.restore();
  }
}

// ==================== ENEMY ====================
class Enemy {
  constructor(x, y, kind) {
    this.x = x; this.y = y;
    this.kind = kind;
    this.knockX = 0; this.knockY = 0;
    this.dmgCd = 0;
    this.facing = 0;
    this.walkCycle = rand(0, 10);
    this.dead = false;
    this.deathTimer = 0;
    this.hurtFlash = 0;
    this.stunTimer = 0;
    this.kbResist = 1;

    // Blinker state
    this.blinkTimer = rand(2.5, 4);
    this.blinkTelegraph = 0; // 0..1 charge to teleport
    this.blinkTargetX = 0;
    this.blinkTargetY = 0;
    this.blinkAfterglow = 0;

    // Boss state (used by miniboss/bigboss)
    this.slamTimer = 5;
    this.slamCharge = 0; // 0..1 charging
    this.slamX = 0; this.slamY = 0;
    this.bossAura = 0;

    if (kind === 'raider') {
      this.r = 9; this.speed = 48;
      this.hp = 30; this.maxHp = 30;
      this.dmg = 10;
      this.color = '#3a2515'; this.skin = '#c4a68a';
      this.hair = '#1a0f05'; this.bloodColor = '#8a1a1a';
    } else if (kind === 'mutant') {
      this.r = 15; this.speed = 32;
      this.hp = 90; this.maxHp = 90;
      this.dmg = 22;
      this.color = '#3a4a2a'; this.skin = '#7a8a55';
      this.hair = '#2a3a20'; this.bloodColor = '#4a6a2a';
    } else if (kind === 'runner') {
      this.r = 8; this.speed = 105;
      this.hp = 22; this.maxHp = 22;
      this.dmg = 8;
      this.color = '#5a3a20'; this.skin = '#d8b890';
      this.hair = '#1a0f05'; this.bloodColor = '#8a1a1a';
    } else if (kind === 'blinker') {
      this.r = 10; this.speed = 38;
      this.hp = 45; this.maxHp = 45;
      this.dmg = 18;
      this.color = '#3a2545'; this.skin = '#a890c8';
      this.hair = '#2a1830'; this.bloodColor = '#5a2a6a';
    } else if (kind === 'miniboss') {
      this.r = 22; this.speed = 40;
      this.hp = 600; this.maxHp = 600;
      this.dmg = 32;
      this.color = '#2a1a0a'; this.skin = '#9a7a55';
      this.hair = '#1a0a05'; this.bloodColor = '#7a1010';
      this.kbResist = 0.35;
      this.name = 'WARLORD';
    } else if (kind === 'bigboss') {
      this.r = 32; this.speed = 28;
      this.hp = 2000; this.maxHp = 2000;
      this.dmg = 48;
      this.color = '#2a3a1a'; this.skin = '#6a8a40';
      this.hair = '#1a2010'; this.bloodColor = '#3a6a1a';
      this.kbResist = 0.18;
      this.name = 'BEHEMOTH';
    } else {
      // ghoul (default)
      this.r = 10; this.speed = 58;
      this.hp = 50; this.maxHp = 50;
      this.dmg = 14;
      this.color = '#4a3a25'; this.skin = '#9a8570';
      this.hair = '#3a2515'; this.bloodColor = '#6a3030';
    }
  }

  update(dt) {
    if (this.dead) { this.deathTimer += dt; return; }

    this.hurtFlash = Math.max(0, this.hurtFlash - dt * 5);
    this.stunTimer = Math.max(0, this.stunTimer - dt);

    if (Math.abs(this.knockX) > 1 || Math.abs(this.knockY) > 1) {
      this.x += this.knockX * dt * this.kbResist;
      this.y += this.knockY * dt * this.kbResist;
      const decay = Math.pow(0.001, dt);
      this.knockX *= decay;
      this.knockY *= decay;
    }

    if (this.stunTimer > 0) {
      if (this.hp <= 0) this._die();
      return;
    }

    // Blinker behavior
    if (this.kind === 'blinker') {
      this.blinkAfterglow = Math.max(0, this.blinkAfterglow - dt * 1.5);
      if (this.blinkTelegraph > 0) {
        // charging teleport - stand still
        this.blinkTelegraph += dt;
        if (this.blinkTelegraph >= 0.7) {
          // execute blink
          this.x = this.blinkTargetX;
          this.y = this.blinkTargetY;
          this.blinkTelegraph = 0;
          this.blinkTimer = rand(2.8, 4.2);
          this.blinkAfterglow = 1;
          // particle puff at new position
          for (let i = 0; i < 14; i++) {
            const a = rand(0, Math.PI * 2);
            const v = rand(30, 110);
            state.particles.push({
              x: this.x, y: this.y,
              vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30,
              life: rand(0.3, 0.7), maxLife: 0.7,
              color: i % 2 === 0 ? '#c890ff' : '#8060c0',
              size: rand(1.2, 2.5), realtime: true,
            });
          }
        }
      } else {
        this.blinkTimer -= dt;
        if (this.blinkTimer <= 0) {
          // pick a target unit and queue a blink behind them
          let tgt = null, nd = Infinity;
          for (const u of state.units) {
            if (u.dead) continue;
            const d = dist2(this.x, this.y, u.x, u.y);
            if (d < nd) { nd = d; tgt = u; }
          }
          if (tgt) {
            // "behind" = opposite the unit's facing
            const behindAng = tgt.facing + Math.PI;
            const dist = rand(70, 95);
            const tx = clamp(tgt.x + Math.cos(behindAng) * dist, 14, W - 14);
            const ty = clamp(tgt.y + Math.sin(behindAng) * dist, 14, PLAY_BOTTOM - 14);
            this.blinkTargetX = tx;
            this.blinkTargetY = ty;
            this.blinkTelegraph = 0.001;
          } else {
            this.blinkTimer = 1.5;
          }
        }
      }
      if (this.blinkTelegraph > 0) {
        // skip movement during charge
        this.dmgCd -= dt;
        if (this.hp <= 0) this._die();
        return;
      }
    }

    // Big boss slam attack
    if (this.kind === 'bigboss') {
      this.bossAura += dt;
      if (this.slamCharge > 0) {
        this.slamCharge += dt;
        if (this.slamCharge >= 1.2) {
          // detonate shockwave
          state.shockwaves.push({
            x: this.slamX, y: this.slamY,
            r: this.r + 4, maxR: 320,
            hit: new Set(),
            life: 1.4, maxLife: 1.4,
            speed: 280, dmg: 35,
          });
          state.shake = Math.max(state.shake, 12);
          this.slamCharge = 0;
          this.slamTimer = rand(4.5, 6.5);
          // particle burst at slam point
          for (let i = 0; i < 30; i++) {
            const a = rand(0, Math.PI * 2);
            const v = rand(60, 220);
            state.particles.push({
              x: this.slamX, y: this.slamY,
              vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80,
              life: rand(0.4, 0.9), maxLife: 0.9,
              color: i % 3 === 0 ? '#a8c060' : '#5a4030',
              size: rand(1.8, 3.2), realtime: true,
            });
          }
        }
      } else {
        this.slamTimer -= dt;
        if (this.slamTimer <= 0) {
          this.slamX = this.x;
          this.slamY = this.y;
          this.slamCharge = 0.001;
        }
      }
      if (this.slamCharge > 0) {
        // anchored while charging slam
        this.dmgCd -= dt;
        if (this.hp <= 0) this._die();
        return;
      }
    }

    let target = null, nd = Infinity;
    for (const u of state.units) {
      if (u.dead) continue;
      const d = dist2(this.x, this.y, u.x, u.y);
      if (d < nd) { nd = d; target = u; }
    }

    if (target) {
      const dx = target.x - this.x, dy = target.y - this.y;
      const d = Math.hypot(dx, dy);
      this.facing = Math.atan2(dy, dx);
      if (d > this.r + target.r - 2) {
        this.x += (dx / d) * this.speed * dt;
        this.y += (dy / d) * this.speed * dt;
        this.walkCycle += dt * 7;
      } else if (this.dmgCd <= 0) {
        target.hp -= this.dmg;
        target.hurtFlash = 1;
        this.dmgCd = 0.75;
        state.shake = Math.max(state.shake, 2);
        for (let i = 0; i < 6; i++) {
          state.particles.push({
            x: target.x + rand(-3, 3), y: target.y + rand(-3, 3),
            vx: rand(-60, 60), vy: rand(-80, -10),
            life: 0.5, maxLife: 0.5,
            color: '#a83a2a', size: rand(1, 2), realtime: true,
          });
        }
      }
    }

    this.dmgCd -= dt;
    if (this.hp <= 0) this._die();
  }

  _die() {
    this.dead = true;
    state.kills++;
    const burst = (this.kind === 'bigboss') ? 80 : (this.kind === 'miniboss') ? 40 : 18;
    for (let i = 0; i < burst; i++) {
      state.particles.push({
        x: this.x, y: this.y,
        vx: rand(-140, 140) * (this.r / 10),
        vy: rand(-160, -20) * (this.r / 10),
        life: rand(0.6, 1.4), maxLife: 1.4,
        color: this.bloodColor, size: rand(1.5, 3.5), realtime: true,
      });
    }
    state.shake = Math.max(state.shake, this.kind === 'bigboss' ? 14 : this.kind === 'miniboss' ? 8 : 4);

    // Boss guaranteed drops
    if (this.kind === 'bigboss') {
      const drops = ['bomb', 'medkit', 'stimpack', 'medkit', 'medkit'];
      for (let i = 0; i < drops.length; i++) {
        const ang = (i / drops.length) * Math.PI * 2;
        const lx = clamp(this.x + Math.cos(ang) * 28, 12, W - 12);
        const ly = clamp(this.y + Math.sin(ang) * 28, 12, PLAY_BOTTOM - 12);
        state.loot.push(new Loot(lx, ly, drops[i]));
      }
      // Bigboss: guaranteed banana bomb + 1 random special weapon
      state.loot.push(new Loot(
        clamp(this.x + 40, 12, W - 12),
        clamp(this.y, 12, PLAY_BOTTOM - 12),
        'banana_bomb'
      ));
      const bbWeapons = ['spray_gun', 'samurai_sword'];
      const bbPick = bbWeapons[Math.floor(Math.random() * bbWeapons.length)];
      state.loot.push(new Loot(
        clamp(this.x - 40, 12, W - 12),
        clamp(this.y, 12, PLAY_BOTTOM - 12),
        bbPick
      ));
      return;
    }
    if (this.kind === 'miniboss') {
      const drops = ['medkit', 'stimpack', 'bomb'];
      for (let i = 0; i < drops.length; i++) {
        const ang = (i / drops.length) * Math.PI * 2 + 0.4;
        const lx = clamp(this.x + Math.cos(ang) * 18, 12, W - 12);
        const ly = clamp(this.y + Math.sin(ang) * 18, 12, PLAY_BOTTOM - 12);
        state.loot.push(new Loot(lx, ly, drops[i]));
      }
      // Miniboss: 1 random special weapon (no banana bomb)
      const mbWeapons = ['spray_gun', 'samurai_sword'];
      const mbPick = mbWeapons[Math.floor(Math.random() * mbWeapons.length)];
      const mbAng = Math.PI;
      state.loot.push(new Loot(
        clamp(this.x + Math.cos(mbAng) * 28, 12, W - 12),
        clamp(this.y + Math.sin(mbAng) * 28, 12, PLAY_BOTTOM - 12),
        mbPick
      ));
      return;
    }

    // Regular enemy loot drop
    const dropRoll = Math.random();
    const dropChance = this.kind === 'mutant' ? 1.0
                     : this.kind === 'ghoul' ? 0.65
                     : this.kind === 'blinker' ? 0.80
                     : this.kind === 'runner' ? 0.30
                     : 0.45;
    const lx = clamp(this.x + rand(-4, 4), 12, W - 12);
    const ly = clamp(this.y + rand(-4, 4), 12, PLAY_BOTTOM - 12);
    if (dropRoll < dropChance) {
      const r = Math.random();
      let lootType;
      if (r < 0.60) lootType = 'medkit';
      else if (r < 0.95) lootType = 'stimpack';
      else lootType = 'bomb';
      state.loot.push(new Loot(lx, ly, lootType));
    }

    // Hard enemies: special weapon secondary roll
    if (this.kind === 'mutant' || this.kind === 'blinker') {
      if (Math.random() < 0.02) {
        // Banana bomb: extreme rarity ~2%
        state.loot.push(new Loot(
          clamp(lx + rand(-8, 8), 12, W - 12),
          clamp(ly + rand(-8, 8), 12, PLAY_BOTTOM - 12),
          'banana_bomb'
        ));
      } else if (Math.random() < 0.20) {
        // Regular special weapon 20%
        const weapons = ['spray_gun', 'samurai_sword'];
        const pick = weapons[Math.floor(Math.random() * weapons.length)];
        state.loot.push(new Loot(
          clamp(lx + rand(-8, 8), 12, W - 12),
          clamp(ly + rand(-8, 8), 12, PLAY_BOTTOM - 12),
          pick
        ));
      }
    }
  }

  draw(ctx) {
    if (this.dead && this.deathTimer > 3) return;

    if (this.dead) {
      const t = this.deathTimer;
      const fade = Math.max(0, 1 - t / 3);
      ctx.fillStyle = `rgba(60, 20, 15, ${0.55 * fade})`;
      ctx.beginPath();
      const spread = Math.min(t * 1.5, 1);
      ctx.ellipse(this.x, this.y + 2, this.r * 1.6 * spread, this.r * 0.7 * spread, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = `rgba(40, 30, 20, ${0.7 * fade})`;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y, this.r * 0.9, this.r * 0.5, this.facing, 0, Math.PI * 2);
      ctx.fill();
      return;
    }

    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + this.r - 1, this.r * 0.9, this.r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    // Blinker telegraph - target spot ring while charging
    if (this.kind === 'blinker' && this.blinkTelegraph > 0) {
      const t = this.blinkTelegraph / 0.7;
      ctx.strokeStyle = `rgba(200, 140, 255, ${0.4 + t * 0.5})`;
      ctx.lineWidth = 1.5;
      ctx.shadowColor = '#c890ff';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(this.blinkTargetX, this.blinkTargetY, 14 + Math.sin(state.time * 18) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(this.blinkTargetX, this.blinkTargetY, 6 * (1 - t), 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      // wisps trailing from current pos to target
      ctx.strokeStyle = `rgba(180, 120, 240, ${0.25 * t})`;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.blinkTargetX, this.blinkTargetY);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Boss aura ring under unit
    if (this.kind === 'miniboss' || this.kind === 'bigboss') {
      const auraR = this.r + (this.kind === 'bigboss' ? 14 : 8) + Math.sin(this.bossAura * 3) * 2;
      const auraColor = this.kind === 'bigboss' ? 'rgba(140, 220, 80, 0.18)' : 'rgba(200, 80, 40, 0.16)';
      ctx.fillStyle = auraColor;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y + this.r - 1, auraR, auraR * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bigboss slam telegraph
    if (this.kind === 'bigboss' && this.slamCharge > 0) {
      const t = this.slamCharge / 1.2;
      ctx.strokeStyle = `rgba(255, 220, 80, ${0.4 + t * 0.5})`;
      ctx.lineWidth = 2 + t * 2;
      ctx.shadowColor = '#ffe060';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(this.slamX, this.slamY, this.r + 8 + (1 - t) * 60, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 100, 40, ${t * 0.6})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(this.slamX, this.slamY, this.r + 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    const wobble = this.stunTimer > 0 ? 0 : Math.sin(this.walkCycle) * 1.2;

    // Blinker translucency
    const prevAlpha = ctx.globalAlpha;
    if (this.kind === 'blinker') {
      ctx.globalAlpha = 0.78 + this.blinkAfterglow * 0.22;
    }

    ctx.save();
    ctx.translate(this.x, this.y + wobble);

    ctx.fillStyle = this.hurtFlash > 0 ? '#d97060' : this.color;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0604';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.arc(2, 3, this.r * 0.9, -0.3, 1.8);
    ctx.lineTo(0, 0);
    ctx.fill();

    ctx.fillStyle = this.hurtFlash > 0 ? '#ffb8a8' : this.skin;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.6, this.r * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0604';
    ctx.stroke();

    if (this.kind === 'mutant') {
      ctx.fillStyle = '#ff4020';
      ctx.shadowColor = '#ff4020';
      ctx.shadowBlur = 4;
      ctx.fillRect(-3, -this.r * 0.65, 1.8, 1.8);
      ctx.fillRect(1.2, -this.r * 0.65, 1.8, 1.8);
      ctx.shadowBlur = 0;
    } else if (this.kind === 'ghoul') {
      ctx.fillStyle = '#f0e890';
      ctx.fillRect(-3, -this.r * 0.65, 1.5, 1.2);
      ctx.fillRect(1.5, -this.r * 0.65, 1.5, 1.2);
    } else if (this.kind === 'runner') {
      // wild wide eyes
      ctx.fillStyle = '#fff8d0';
      ctx.fillRect(-3, -this.r * 0.7, 2, 1.4);
      ctx.fillRect(1, -this.r * 0.7, 2, 1.4);
      ctx.fillStyle = '#1a0a05';
      ctx.fillRect(-2.5, -this.r * 0.66, 1, 1);
      ctx.fillRect(1.5, -this.r * 0.66, 1, 1);
    } else if (this.kind === 'blinker') {
      ctx.fillStyle = '#e8c0ff';
      ctx.shadowColor = '#c890ff';
      ctx.shadowBlur = 5;
      ctx.fillRect(-3, -this.r * 0.65, 1.8, 1.8);
      ctx.fillRect(1.2, -this.r * 0.65, 1.8, 1.8);
      ctx.shadowBlur = 0;
    } else if (this.kind === 'miniboss') {
      ctx.fillStyle = '#ffd040';
      ctx.shadowColor = '#ff8020';
      ctx.shadowBlur = 5;
      ctx.fillRect(-5, -this.r * 0.72, 3, 2);
      ctx.fillRect(2, -this.r * 0.72, 3, 2);
      ctx.shadowBlur = 0;
    } else if (this.kind === 'bigboss') {
      ctx.fillStyle = '#fff060';
      ctx.shadowColor = '#a0ff20';
      ctx.shadowBlur = 9;
      ctx.fillRect(-7, -this.r * 0.72, 4, 3);
      ctx.fillRect(3, -this.r * 0.72, 4, 3);
      ctx.fillStyle = '#fffac0';
      ctx.fillRect(-6, -this.r * 0.72, 1.5, 1.5);
      ctx.fillRect(4, -this.r * 0.72, 1.5, 1.5);
      ctx.shadowBlur = 0;
    } else {
      ctx.fillStyle = '#1a0f06';
      ctx.fillRect(-3, -this.r * 0.7, 1.5, 1);
      ctx.fillRect(1.5, -this.r * 0.7, 1.5, 1);
    }

    if (this.kind === 'raider') {
      ctx.fillStyle = this.hair;
      ctx.beginPath();
      ctx.arc(0, -this.r * 0.78, this.r * 0.48, Math.PI + 0.2, -0.2);
      ctx.fill();
    } else if (this.kind === 'mutant') {
      ctx.fillStyle = '#2a3a1a';
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 3, -this.r * 0.85);
        ctx.lineTo(i * 3 - 1, -this.r * 1.2);
        ctx.lineTo(i * 3 + 1, -this.r * 1.2);
        ctx.closePath();
        ctx.fill();
      }
    } else if (this.kind === 'runner') {
      ctx.fillStyle = this.hair;
      for (let i = -2; i <= 2; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 1.6, -this.r * 0.78);
        ctx.lineTo(i * 1.6 - 0.6, -this.r * 1.15);
        ctx.lineTo(i * 1.6 + 0.6, -this.r * 1.15);
        ctx.closePath();
        ctx.fill();
      }
    } else if (this.kind === 'blinker') {
      ctx.fillStyle = '#1a1025';
      ctx.beginPath();
      ctx.arc(0, -this.r * 0.5, this.r * 0.7, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = 'rgba(180, 130, 240, 0.6)';
      ctx.lineWidth = 0.8;
      for (let i = 0; i < 3; i++) {
        const ang = state.time * 1.5 + i * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * (this.r + 1), Math.sin(ang) * (this.r + 1));
        ctx.lineTo(Math.cos(ang) * (this.r + 5), Math.sin(ang) * (this.r + 5) - 1);
        ctx.stroke();
      }
    } else if (this.kind === 'miniboss') {
      ctx.fillStyle = '#1a0f06';
      ctx.beginPath();
      ctx.arc(0, -this.r * 0.72, this.r * 0.62, Math.PI - 0.2, 0.2);
      ctx.fill();
      ctx.fillStyle = '#5a3025';
      ctx.fillRect(-this.r * 0.55, -this.r * 0.6, this.r * 1.1, 2);
      ctx.fillStyle = '#3a2515';
      ctx.beginPath();
      ctx.moveTo(-this.r * 0.85, -2);
      ctx.lineTo(-this.r * 1.3, -this.r * 0.5);
      ctx.lineTo(-this.r * 0.6, -this.r * 0.2);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(this.r * 0.85, -2);
      ctx.lineTo(this.r * 1.3, -this.r * 0.5);
      ctx.lineTo(this.r * 0.6, -this.r * 0.2);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#5a4a3a';
      ctx.fillRect(-this.r * 0.4, -this.r * 0.05, this.r * 0.8, this.r * 0.55);
      ctx.strokeStyle = '#1a0f06';
      ctx.lineWidth = 0.8;
      ctx.strokeRect(-this.r * 0.4, -this.r * 0.05, this.r * 0.8, this.r * 0.55);
    } else if (this.kind === 'bigboss') {
      ctx.strokeStyle = 'rgba(160, 240, 80, 0.75)';
      ctx.lineWidth = 1.4;
      ctx.shadowColor = '#a0ff40';
      ctx.shadowBlur = 6;
      for (let i = 0; i < 5; i++) {
        const ang = i * (Math.PI * 2 / 5) + this.bossAura * 0.3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        const r1 = this.r * 0.5, r2 = this.r * 0.95;
        ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
        ctx.lineTo(Math.cos(ang + 0.25) * r2, Math.sin(ang + 0.25) * r2);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#1a1505';
      for (let i = -2; i <= 2; i++) {
        const ang = i * 0.32 - Math.PI / 2;
        const baseR = this.r * 0.85;
        const tipR = this.r * 1.45;
        ctx.beginPath();
        ctx.moveTo(Math.cos(ang) * baseR, Math.sin(ang) * baseR);
        ctx.lineTo(Math.cos(ang - 0.06) * baseR * 1.05, Math.sin(ang - 0.06) * baseR * 1.05);
        ctx.lineTo(Math.cos(ang) * tipR, Math.sin(ang) * tipR);
        ctx.lineTo(Math.cos(ang + 0.06) * baseR * 1.05, Math.sin(ang + 0.06) * baseR * 1.05);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#fff8d0';
      ctx.beginPath();
      ctx.moveTo(-2.5, -this.r * 0.4);
      ctx.lineTo(-1.5, -this.r * 0.2);
      ctx.lineTo(-0.5, -this.r * 0.4);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0.5, -this.r * 0.4);
      ctx.lineTo(1.5, -this.r * 0.2);
      ctx.lineTo(2.5, -this.r * 0.4);
      ctx.fill();
    } else {
      ctx.fillStyle = '#5a4a35';
      ctx.fillRect(-3, -this.r * 0.9, 2, 2);
      ctx.fillRect(1, -this.r * 0.85, 2, 1.5);
    }

    ctx.restore();
    ctx.globalAlpha = prevAlpha;

    // Bigboss radiation sparkles
    if (this.kind === 'bigboss' && Math.random() < 0.25) {
      const a = rand(0, Math.PI * 2);
      const r = rand(this.r * 0.6, this.r + 4);
      state.particles.push({
        x: this.x + Math.cos(a) * r,
        y: this.y + Math.sin(a) * r,
        vx: rand(-10, 10), vy: rand(-30, -5),
        life: rand(0.4, 0.8), maxLife: 0.8,
        color: '#a0ff60', size: rand(1, 2), realtime: true,
      });
    }

    const wpnLen = this.kind === 'bigboss' ? 14
                 : this.kind === 'miniboss' ? 11
                 : this.kind === 'mutant' ? 8 : 5;
    const wpnW = this.kind === 'bigboss' ? 3.5
               : this.kind === 'miniboss' ? 3
               : this.kind === 'mutant' ? 2 : 1.5;
    const wx = this.x + Math.cos(this.facing) * (this.r + 2);
    const wy = this.y + Math.sin(this.facing) * (this.r + 2);
    ctx.strokeStyle = (this.kind === 'mutant' || this.kind === 'bigboss') ? '#8a7060' : '#4a3a28';
    ctx.lineWidth = wpnW;
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.lineTo(wx + Math.cos(this.facing) * wpnLen,
               wy + Math.sin(this.facing) * wpnLen);
    ctx.stroke();

    // Stun visuals
    if (this.stunTimer > 0) {
      ctx.strokeStyle = 'rgba(180, 220, 255, 0.85)';
      ctx.lineWidth = 1.2;
      ctx.shadowColor = '#80c8ff';
      ctx.shadowBlur = 5;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(this.x + rand(-this.r, this.r), this.y + rand(-this.r, this.r));
        ctx.lineTo(this.x + rand(-this.r, this.r), this.y + rand(-this.r, this.r));
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      for (let i = 0; i < 3; i++) {
        const a = state.time * 6 + (i * Math.PI * 2 / 3);
        const sx = this.x + Math.cos(a) * (this.r + 5);
        const sy = this.y - this.r * 0.5 + Math.sin(a) * 3;
        ctx.fillStyle = '#c0e8ff';
        ctx.shadowColor = '#80c8ff';
        ctx.shadowBlur = 6;
        ctx.fillRect(sx - 1.5, sy - 1.5, 3, 3);
      }
      ctx.shadowBlur = 0;
    }

    if (this.hp < this.maxHp || this.kind === 'miniboss' || this.kind === 'bigboss') {
      const isBoss = this.kind === 'miniboss' || this.kind === 'bigboss';
      const barW = isBoss ? this.r * 3.6 : this.r * 2.2;
      const barH = isBoss ? 4 : 2.5;
      const barX = this.x - barW / 2;
      const barY = this.y - this.r - (isBoss ? 18 : 9);
      ctx.fillStyle = 'rgba(0,0,0,0.78)';
      ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
      const hpPct = Math.max(0, this.hp / this.maxHp);
      ctx.fillStyle = this.kind === 'bigboss' ? '#a8d040'
                    : this.kind === 'miniboss' ? '#d05a35'
                    : '#a83a2a';
      ctx.fillRect(barX, barY, barW * hpPct, barH);
      if (isBoss) {
        ctx.fillStyle = this.kind === 'bigboss' ? '#c8ff80' : '#ffb070';
        ctx.font = 'bold 10px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 3;
        ctx.fillText(this.name, this.x, barY - 4);
        ctx.shadowBlur = 0;
        ctx.textAlign = 'left';
      }
    }
  }
}

// ==================== STATE ====================
const state = {
  units: [],
  enemies: [],
  particles: [],
  bolts: [],
  projectiles: [],
  loot: [],
  explosions: [],
  shockwaves: [],
  debris: [],
  dust: [],
  cracks: [],
  bloodStains: [],
  selected: [],
  mouse: { x: 0, y: 0, down: false, downX: 0, downY: 0, startedOnUnit: false, clickedPortrait: false },
  selectionBox: null,
  moveMarkers: [],
  time: 0,
  shake: 0,
  kills: 0,
  wave: 1,
  waveTimer: 0,
  spawnTimer: 1.5,
  spawnInterval: 1.4,
  gameOver: false,
  timeFlow: 0,
  timeSpeed: 0,
  manualPause: false,
  survivedSeconds: 0,
};

function generateTerrain() {
  state.debris = [];
  state.cracks = [];
  for (let i = 0; i < 90; i++) {
    state.debris.push({
      x: rand(20, W - 20),
      y: rand(20, PLAY_BOTTOM - 10),
      type: randInt(0, 4),
      rot: rand(0, Math.PI * 2),
      size: rand(0.7, 1.4),
      shade: rand(0.65, 1),
    });
  }
  for (let i = 0; i < 18; i++) {
    const x = rand(0, W), y = rand(0, PLAY_BOTTOM);
    const len = rand(40, 120);
    const ang = rand(0, Math.PI * 2);
    const pts = [{ x, y }];
    let cx = x, cy = y;
    for (let s = 0; s < 5; s++) {
      cx += Math.cos(ang + rand(-0.5, 0.5)) * (len / 5);
      cy += Math.sin(ang + rand(-0.5, 0.5)) * (len / 5);
      pts.push({ x: cx, y: cy });
    }
    state.cracks.push(pts);
  }
  state.dust = [];
  for (let i = 0; i < 55; i++) {
    state.dust.push({
      x: rand(0, W), y: rand(0, PLAY_BOTTOM),
      vx: rand(-12, 12), vy: rand(-4, 4),
      life: rand(0, 1), size: rand(0.6, 1.4),
    });
  }
}

function newGame() {
  state.units = [];
  state.enemies = [];
  state.particles = [];
  state.bolts = [];
  state.projectiles = [];
  state.loot = [];
  state.explosions = [];
  state.shockwaves = [];
  state.bloodStains = [];
  state.selected = [];
  state.moveMarkers = [];
  state.time = 0;
  state.kills = 0;
  state.wave = 1;
  state.waveTimer = 0;
  state.spawnTimer = 1.5;
  state.spawnInterval = 1.4;
  state.gameOver = false;
  state.victory = false;
  state.timeFlow = 0;
  state.manualPause = false;
  state.timeSpeed = 0;
  state.survivedSeconds = 0;

  document.getElementById('gameOverText').textContent = 'ALL SURVIVORS DEAD';
  document.getElementById('gameOverText').classList.remove('victory');

  const cx = W / 2, cy = PLAY_BOTTOM / 2;
  state.units.push(new Unit(cx - 44, cy + 8, 'elliot'));
  state.units.push(new Unit(cx, cy - 10, 'dikiy'));
  state.units.push(new Unit(cx + 44, cy + 8, 'dick'));

  document.getElementById('overlay').classList.remove('show');
  document.getElementById('survCount').textContent = state.units.length;
  updateHUD();
}

function spawnEnemy() {
  const edge = randInt(0, 3);
  let x, y;
  const margin = 40;
  if (edge === 0) { x = rand(-margin, W + margin); y = -margin; }
  else if (edge === 1) { x = W + margin; y = rand(-margin, PLAY_BOTTOM + margin); }
  else if (edge === 2) { x = rand(-margin, W + margin); y = PLAY_BOTTOM + margin; }
  else { x = -margin; y = rand(-margin, PLAY_BOTTOM + margin); }

  const r = Math.random();
  let kind;
  const w = state.wave;
  // Expanded spawn pool — runners enter at wave 2, blinkers at wave 3
  // Pool gets richer with each wave; runners and blinkers fill an increasing share.
  if (w >= 4 && r < 0.18) kind = 'mutant';
  else if (w >= 3 && r < (w >= 5 ? 0.32 : 0.22)) kind = 'blinker';
  else if (w >= 2 && r < (w >= 5 ? 0.52 : 0.40)) kind = 'runner';
  else if (w >= 2 && r < (w >= 5 ? 0.74 : 0.62)) kind = 'ghoul';
  else kind = 'raider';

  state.enemies.push(new Enemy(x, y, kind));
}

function spawnBoss(kind) {
  // Spawn from a random edge
  const edge = randInt(0, 3);
  let x, y;
  const margin = 60;
  if (edge === 0) { x = rand(W * 0.2, W * 0.8); y = -margin; }
  else if (edge === 1) { x = W + margin; y = rand(PLAY_BOTTOM * 0.2, PLAY_BOTTOM * 0.8); }
  else if (edge === 2) { x = rand(W * 0.2, W * 0.8); y = PLAY_BOTTOM + margin; }
  else { x = -margin; y = rand(PLAY_BOTTOM * 0.2, PLAY_BOTTOM * 0.8); }
  state.enemies.push(new Enemy(x, y, kind));
}

function applyLoot(loot, unit) {
  if (loot.type === 'medkit') {
    const heal = 60;
    const before = unit.hp;
    unit.hp = Math.min(unit.maxHp, unit.hp + heal);
    const actual = unit.hp - before;
    // green/white particles
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(20, 90);
      state.particles.push({
        x: loot.x, y: loot.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: rand(0.4, 0.9), maxLife: 0.9,
        color: i % 3 === 0 ? '#ffffff' : '#5fd06a',
        size: rand(1.5, 3), realtime: true,
      });
    }
    // floating "+heal" marker reusing moveMarkers? simpler: a few sparkles
    state.moveMarkers.push({ x: unit.x, y: unit.y - 18, life: 0.9, maxLife: 0.9, type: 'heal', text: '+' + actual });
  } else if (loot.type === 'stimpack') {
    unit.rageTimer = Math.max(unit.rageTimer, 5);
    unit.abilityCd = Math.max(unit.abilityCd - 2, 0);
    for (let i = 0; i < 22; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(30, 120);
      state.particles.push({
        x: loot.x, y: loot.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80,
        life: rand(0.4, 1.0), maxLife: 1.0,
        color: i % 2 === 0 ? '#ff6040' : '#ffb070',
        size: rand(1.5, 3), realtime: true,
      });
    }
    state.shake = Math.max(state.shake, 4);
    state.moveMarkers.push({ x: unit.x, y: unit.y - 18, life: 0.9, maxLife: 0.9, type: 'stim', text: 'RAGE' });
  } else if (loot.type === 'bomb') {
    detonateBomb(loot.x, loot.y);
  } else if (loot.type === 'spray_gun') {
    unit.activeWeapon = 'spray_gun';
    unit.activeWeaponTimer = 15;
    for (let i = 0; i < 20; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(30, 110);
      state.particles.push({
        x: loot.x, y: loot.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
        life: rand(0.3, 0.8), maxLife: 0.8,
        color: i % 2 === 0 ? '#ffa040' : '#ffe080',
        size: rand(1.5, 3), realtime: true,
      });
    }
    state.shake = Math.max(state.shake, 3);
    state.moveMarkers.push({ x: unit.x, y: unit.y - 18, life: 1.1, maxLife: 1.1, type: 'stim', text: 'SPRAY GUN!' });
  } else if (loot.type === 'samurai_sword') {
    unit.activeWeapon = 'samurai_sword';
    unit.activeWeaponTimer = 20;
    for (let i = 0; i < 22; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(30, 120);
      state.particles.push({
        x: loot.x, y: loot.y,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 70,
        life: rand(0.3, 0.9), maxLife: 0.9,
        color: i % 2 === 0 ? '#e8e060' : '#ffffff',
        size: rand(1.5, 3), realtime: true,
      });
    }
    state.shake = Math.max(state.shake, 4);
    state.moveMarkers.push({ x: unit.x, y: unit.y - 18, life: 1.1, maxLife: 1.1, type: 'stim', text: 'KATANA!' });
  } else if (loot.type === 'banana_bomb') {
    detonateBananaBomb(loot.x, loot.y);
  }
}

function detonateBomb(x, y) {
  const radius = 280;
  for (const e of state.enemies) {
    if (e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < radius) {
      const ang = Math.atan2(e.y - y, e.x - x);
      const force = (1 - d / radius) * 380;
      e.knockX += Math.cos(ang) * force;
      e.knockY += Math.sin(ang) * force;
      e.hp = -999;
      e._die();
    }
  }
  // big particle burst
  for (let i = 0; i < 90; i++) {
    const a = rand(0, Math.PI * 2);
    const v = rand(80, 380);
    const palette = ['#fff8d0', '#ffe070', '#ffa040', '#ff6020', '#5a2010', '#3a2515'];
    state.particles.push({
      x: x + rand(-4, 4), y: y + rand(-4, 4),
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(40, 120),
      life: rand(0.4, 1.2), maxLife: 1.2,
      color: palette[randInt(0, palette.length - 1)],
      size: rand(2, 4.5), realtime: true,
    });
  }
  // smoke afterward (slower, gray)
  for (let i = 0; i < 30; i++) {
    const a = rand(0, Math.PI * 2);
    const v = rand(20, 80);
    state.particles.push({
      x: x + rand(-8, 8), y: y + rand(-8, 8),
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40,
      life: rand(0.8, 1.6), maxLife: 1.6,
      color: '#5a5045',
      size: rand(2.5, 5), realtime: true,
    });
  }
  state.explosions.push({ x, y, r: 8, maxR: radius, life: 0.55, maxLife: 0.55 });
  state.shake = Math.max(state.shake, 18);
}

function detonateBananaBomb(x, y) {
  const radius = 420; // larger blast radius than regular bomb
  for (const e of state.enemies) {
    if (e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < radius) {
      const ang = Math.atan2(e.y - y, e.x - x);
      const force = (1 - d / radius) * 500;
      e.knockX += Math.cos(ang) * force;
      e.knockY += Math.sin(ang) * force;
      e.hp = -999;
      e._die();
      e.stunTimer = Math.max(e.stunTimer || 0, 2.5); // stun survivors (edge cases)
    }
  }
  // yellow/green banana explosion particles
  for (let i = 0; i < 120; i++) {
    const a = rand(0, Math.PI * 2);
    const v = rand(100, 480);
    const palette = ['#fff8a0', '#ffe030', '#c8d820', '#80b020', '#3a6010', '#fff0c0'];
    state.particles.push({
      x: x + rand(-6, 6), y: y + rand(-6, 6),
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - rand(60, 160),
      life: rand(0.5, 1.4), maxLife: 1.4,
      color: palette[randInt(0, palette.length - 1)],
      size: rand(2, 5), realtime: true,
    });
  }
  // smoke
  for (let i = 0; i < 40; i++) {
    const a = rand(0, Math.PI * 2);
    const v = rand(20, 90);
    state.particles.push({
      x: x + rand(-10, 10), y: y + rand(-10, 10),
      vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50,
      life: rand(0.9, 1.8), maxLife: 1.8,
      color: '#7a7050',
      size: rand(3, 6), realtime: true,
    });
  }
  state.explosions.push({ x, y, r: 10, maxR: radius, life: 0.7, maxLife: 0.7 });
  state.shake = Math.max(state.shake, 26);
}

// ==================== INPUT ====================
canvas.addEventListener('contextmenu', e => e.preventDefault());

function canvasPt(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height),
  };
}

function getPortraitUnit(x, y) {
  const slotW = 150, slotH = PANEL_H, gap = 12;
  const slots = state.units;
  const totalW = slots.length * slotW + (slots.length - 1) * gap;
  const startX = (W - totalW) / 2;
  const py = H - slotH - 12;
  if (y < py || y > py + slotH) return null;
  for (let i = 0; i < slots.length; i++) {
    const px = startX + i * (slotW + gap);
    if (x >= px && x <= px + slotW) return slots[i];
  }
  return null;
}

canvas.addEventListener('mousedown', (e) => {
  if (state.gameOver) return;
  const p = canvasPt(e);
  state.mouse.x = p.x; state.mouse.y = p.y;

  if (e.button === 0) {
    const pu = getPortraitUnit(p.x, p.y);
    if (pu) {
      state.mouse.clickedPortrait = true;
      if (pu.dead) return;
      if (e.shiftKey) {
        const idx = state.selected.indexOf(pu);
        if (idx >= 0) state.selected.splice(idx, 1);
        else state.selected.push(pu);
      } else {
        state.selected = [pu];
      }
      for (const u of state.units) u.selected = state.selected.includes(u);
      return;
    }
    state.mouse.clickedPortrait = false;
    state.mouse.down = true;
    state.mouse.downX = p.x;
    state.mouse.downY = p.y;
    state.selectionBox = null;
    state.mouse.startedOnUnit = state.units.some(u => !u.dead && dist2(p.x, p.y, u.x, u.y) < u.r + 4);
  } else if (e.button === 2) {
    if (state.selected.length === 0) return;
    if (p.y > PLAY_BOTTOM + 10) return;

    let targetEnemy = null;
    for (const en of state.enemies) {
      if (en.dead) continue;
      if (dist2(p.x, p.y, en.x, en.y) < en.r + 6) { targetEnemy = en; break; }
    }

    if (targetEnemy) {
      for (const u of state.selected) u.attackMove(targetEnemy);
      state.moveMarkers.push({ x: targetEnemy.x, y: targetEnemy.y, life: 0.7, maxLife: 0.7, type: 'attack' });
    } else {
      const n = state.selected.length;
      if (n === 1) {
        state.selected[0].moveTo(p.x, p.y);
      } else {
        const spacing = 26;
        const cols = Math.ceil(Math.sqrt(n));
        const rows = Math.ceil(n / cols);
        state.selected.forEach((u, i) => {
          const row = Math.floor(i / cols);
          const col = i % cols;
          const dx = (col - (cols - 1) / 2) * spacing;
          const dy = (row - (rows - 1) / 2) * spacing;
          u.moveTo(p.x + dx, p.y + dy);
        });
      }
      state.moveMarkers.push({ x: p.x, y: p.y, life: 0.6, maxLife: 0.6, type: 'move' });
    }
  }
});

canvas.addEventListener('mousemove', (e) => {
  const p = canvasPt(e);
  state.mouse.x = p.x; state.mouse.y = p.y;
  if (state.mouse.down && !state.mouse.startedOnUnit) {
    const dr = dist2(p.x, p.y, state.mouse.downX, state.mouse.downY);
    if (dr > 6) {
      state.selectionBox = {
        x1: state.mouse.downX, y1: state.mouse.downY,
        x2: p.x, y2: p.y,
      };
    }
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (e.button !== 0) return;
  if (state.gameOver || state.mouse.clickedPortrait) {
    state.mouse.down = false;
    state.mouse.clickedPortrait = false;
    return;
  }

  const p = canvasPt(e);

  if (state.selectionBox) {
    const box = state.selectionBox;
    const minX = Math.min(box.x1, box.x2), maxX = Math.max(box.x1, box.x2);
    const minY = Math.min(box.y1, box.y2), maxY = Math.max(box.y1, box.y2);
    if (!e.shiftKey) state.selected = [];
    for (const u of state.units) {
      if (u.dead) continue;
      if (u.x >= minX && u.x <= maxX && u.y >= minY && u.y <= maxY) {
        if (!state.selected.includes(u)) state.selected.push(u);
      }
    }
    state.selectionBox = null;
  } else {
    let clicked = null;
    for (const u of state.units) {
      if (u.dead) continue;
      if (dist2(p.x, p.y, u.x, u.y) < u.r + 5) { clicked = u; break; }
    }
    if (clicked) {
      if (e.shiftKey) {
        const idx = state.selected.indexOf(clicked);
        if (idx >= 0) state.selected.splice(idx, 1);
        else state.selected.push(clicked);
      } else {
        state.selected = [clicked];
      }
    } else if (!e.shiftKey) {
      state.selected = [];
    }
  }

  for (const u of state.units) u.selected = state.selected.includes(u);
  state.mouse.down = false;
});

document.addEventListener('keydown', (e) => {
  if (state.gameOver) {
    if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') newGame();
    return;
  }
  const k = e.key.toLowerCase();

  if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd') {
    e.preventDefault();
    state.timeSpeed = clamp(state.timeSpeed + 1, 0, 3);
    state.manualPause = false;
    return;
  }
  if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract') {
    e.preventDefault();
    state.timeSpeed = clamp(state.timeSpeed - 1, 0, 3);
    state.manualPause = state.timeSpeed === 0;
    return;
  }
  if (k === 's') {
    for (const u of state.selected) u.stop();
    return;
  }
  if (e.key === ' ') {
    e.preventDefault();
    state.timeSpeed = 0;
    state.manualPause = true;
    return;
  }
  if (k === 'a' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    state.selected = state.units.filter(u => !u.dead);
    for (const u of state.units) u.selected = state.selected.includes(u);
    return;
  }

  if (k === 'q' || k === 'w' || k === 'e') {
    e.preventDefault();
    for (const u of state.selected) {
      if (u.abilityKey.toLowerCase() === k && !u.dead) u.cast();
    }
  }
});

document.getElementById('restart').addEventListener('click', newGame);

// ==================== DRAWING ====================
function drawBackground() {
  ctx.fillStyle = '#6b5335';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(90, 70, 45, 0.4)';
  for (let i = 0; i < 160; i++) {
    const x = (i * 173 + 37) % W;
    const y = (i * 91 + 53) % H;
    ctx.fillRect(x, y, 2, 1);
  }
  ctx.fillStyle = 'rgba(130, 100, 60, 0.3)';
  for (let i = 0; i < 110; i++) {
    const x = (i * 211 + 11) % W;
    const y = (i * 67 + 31) % H;
    ctx.fillRect(x, y, 1, 1);
  }

  for (let i = 0; i < 25; i++) {
    const px = (i * 97 + 31) % W;
    const py = (i * 53 + 19) % H;
    ctx.fillStyle = `rgba(30, 20, 10, ${0.13 + (i % 3) * 0.05})`;
    ctx.beginPath();
    ctx.ellipse(px, py, 50 + (i * 7) % 40, 30 + (i * 5) % 25, (i * 0.3) % (Math.PI * 2), 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(20, 12, 6, 0.5)';
  ctx.lineWidth = 0.8;
  for (const crack of state.cracks) {
    ctx.beginPath();
    ctx.moveTo(crack[0].x, crack[0].y);
    for (let i = 1; i < crack.length; i++) ctx.lineTo(crack[i].x, crack[i].y);
    ctx.stroke();
  }

  for (const b of state.bloodStains) {
    ctx.fillStyle = `rgba(50, 15, 10, ${b.a})`;
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r, b.r * 0.55, b.rot, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const d of state.debris) {
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.scale(d.size, d.size);
    if (d.type === 0) {
      ctx.fillStyle = `rgba(210, 195, 160, ${d.shade * 0.85})`;
      ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1a0f06';
      ctx.fillRect(-2, -1, 1.2, 1.5); ctx.fillRect(0.8, -1, 1.2, 1.5); ctx.fillRect(-0.5, 1.2, 1, 1);
    } else if (d.type === 1) {
      ctx.strokeStyle = `rgba(25, 18, 12, ${d.shade})`; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = `rgba(50, 35, 25, ${d.shade * 0.6})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.stroke();
    } else if (d.type === 2) {
      ctx.fillStyle = `rgba(75, 45, 25, ${d.shade})`;
      ctx.fillRect(-7, -1.2, 14, 2.4);
      ctx.fillStyle = `rgba(40, 25, 12, ${d.shade * 0.8})`;
      ctx.fillRect(-7, -1.2, 14, 0.8);
    } else if (d.type === 3) {
      ctx.fillStyle = `rgba(215, 200, 170, ${d.shade * 0.8})`;
      ctx.fillRect(-5, -0.8, 10, 1.6);
      ctx.beginPath();
      ctx.arc(-5, 0, 1.6, 0, Math.PI * 2); ctx.arc(5, 0, 1.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = `rgba(110, 55, 28, ${d.shade * 0.85})`;
      ctx.fillRect(-4, -3, 8, 6);
      ctx.fillStyle = `rgba(30, 15, 8, ${d.shade * 0.5})`;
      ctx.fillRect(-3, -2, 2, 1); ctx.fillRect(1, 0, 2, 2);
      ctx.fillStyle = `rgba(180, 90, 45, ${d.shade * 0.3})`;
      ctx.fillRect(-2, -1, 1, 1);
    }
    ctx.restore();
  }

  for (const p of state.dust) {
    const fade = 1 - Math.abs(p.life - 0.5) * 2;
    ctx.fillStyle = `rgba(210, 185, 140, ${0.35 * fade})`;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }

  const grad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.75);
  grad.addColorStop(0, 'rgba(80, 55, 25, 0)');
  grad.addColorStop(0.7, 'rgba(40, 20, 10, 0.4)');
  grad.addColorStop(1, 'rgba(10, 5, 2, 0.8)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(140, 80, 30, 0.05)';
  ctx.fillRect(0, 0, W, H);
}

function drawBolts() {
  for (const bolt of state.bolts) {
    const intensity = bolt.life / bolt.maxLife;
    ctx.strokeStyle = `rgba(120, 180, 255, ${intensity * 0.4})`;
    ctx.lineWidth = 6;
    ctx.shadowColor = '#80c8ff';
    ctx.shadowBlur = 14 * intensity;
    for (let i = 0; i < bolt.points.length - 1; i++) {
      drawZigzag(bolt.points[i].x, bolt.points[i].y, bolt.points[i + 1].x, bolt.points[i + 1].y, 12);
    }
    ctx.strokeStyle = `rgba(180, 220, 255, ${intensity})`;
    ctx.lineWidth = 2.5;
    for (let i = 0; i < bolt.points.length - 1; i++) {
      drawZigzag(bolt.points[i].x, bolt.points[i].y, bolt.points[i + 1].x, bolt.points[i + 1].y, 10);
    }
    ctx.strokeStyle = `rgba(255, 255, 255, ${intensity * 0.95})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < bolt.points.length - 1; i++) {
      drawZigzag(bolt.points[i].x, bolt.points[i].y, bolt.points[i + 1].x, bolt.points[i + 1].y, 10);
    }
    ctx.shadowBlur = 0;
  }
}

function drawZigzag(x1, y1, x2, y2, segments) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  for (let i = 1; i < segments; i++) {
    const t = i / segments;
    const px = x1 + (x2 - x1) * t + rand(-7, 7);
    const py = y1 + (y2 - y1) * t + rand(-7, 7);
    ctx.lineTo(px, py);
  }
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawAbilityPanel() {
  const slotW = 150, slotH = PANEL_H, gap = 12;
  const slots = state.units;
  const totalW = slots.length * slotW + (slots.length - 1) * gap;
  const startX = (W - totalW) / 2;
  const y = H - slotH - 12;

  ctx.fillStyle = 'rgba(10, 6, 3, 0.6)';
  ctx.fillRect(0, y - 4, W, slotH + 10);
  ctx.strokeStyle = '#3a2a18';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, y - 4); ctx.lineTo(W, y - 4);
  ctx.stroke();

  for (let i = 0; i < slots.length; i++) {
    const u = slots[i];
    const x = startX + i * (slotW + gap);

    ctx.fillStyle = u.dead ? 'rgba(30, 8, 5, 0.88)' : 'rgba(20, 12, 6, 0.92)';
    ctx.fillRect(x, y, slotW, slotH);
    ctx.strokeStyle = u.dead ? '#5a2a1a' : u.selected ? '#c5a572' : '#3a2a18';
    ctx.lineWidth = u.selected && !u.dead ? 2 : 1;
    ctx.strokeRect(x, y, slotW, slotH);

    if (u.type === 'dikiy' && u.rageTimer > 0) {
      const pulse = 0.5 + Math.sin(state.time * 12) * 0.5;
      ctx.strokeStyle = `rgba(255, 60, 30, ${0.5 + pulse * 0.5})`;
      ctx.lineWidth = 2;
      ctx.strokeRect(x - 1, y - 1, slotW + 2, slotH + 2);
    }

    // Mini portrait
    const pxc = x + 16, pyc = y + 20;
    ctx.save();
    ctx.translate(pxc, pyc);
    ctx.scale(0.65, 0.65);
    const savedSelected = u.selected;
    u.selected = false;
    if (u.type === 'elliot') u._drawElliot(ctx, 0);
    else if (u.type === 'dikiy') u._drawDikiy(ctx, 0);
    else if (u.type === 'dick') u._drawDick(ctx, 0);
    u.selected = savedSelected;
    ctx.restore();

    ctx.fillStyle = u.dead ? '#8a4a3a' : '#e8d8b0';
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'left';
    ctx.fillText(u.name.toUpperCase(), x + 34, y + 16);

    if (u.dead) {
      ctx.fillStyle = '#a83a2a';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillText('DEAD', x + 34, y + 34);
      continue;
    }

    ctx.font = '10px "Courier New", monospace';
    ctx.fillStyle = '#8a6b3a';
    ctx.textAlign = 'right';
    ctx.fillText(`${Math.ceil(u.hp)}/${u.maxHp}`, x + slotW - 8, y + 16);
    ctx.textAlign = 'left';

    const barLeft = x + 34;
    const barW = slotW - 34 - 8;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(barLeft, y + 22, barW, 5);
    const hpPct = u.hp / u.maxHp;
    ctx.fillStyle = hpPct > 0.5 ? '#7aa853' : hpPct > 0.25 ? '#c5a247' : '#a83a2a';
    ctx.fillRect(barLeft, y + 22, barW * hpPct, 5);

    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillStyle = u.abilityCd > 0 ? '#6a5030' : u.abilityColor;
    ctx.fillText(`[${u.abilityKey}] ${u.abilityName}`, x + 8, y + 46);

    if (u.type === 'dikiy' && u.rageTimer > 0) {
      ctx.fillStyle = '#ff8040';
      ctx.textAlign = 'right';
      ctx.font = '10px "Courier New", monospace';
      ctx.fillText(`${u.rageTimer.toFixed(1)}s`, x + slotW - 8, y + 46);
      ctx.textAlign = 'left';
    }

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(x + 8, y + 52, slotW - 16, 6);
    if (u.abilityCd > 0) {
      const cdPct = 1 - (u.abilityCd / u.abilityMaxCd);
      ctx.fillStyle = '#5a3a70';
      ctx.fillRect(x + 8, y + 52, (slotW - 16) * cdPct, 6);
      ctx.fillStyle = '#c5a572';
      ctx.font = '9px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(`${u.abilityCd.toFixed(1)}s`, x + slotW - 8, y + 66);
      ctx.textAlign = 'left';
    } else {
      ctx.fillStyle = u.abilityColor;
      ctx.fillRect(x + 8, y + 52, slotW - 16, 6);
      ctx.fillStyle = u.abilityColor;
      ctx.font = 'bold 9px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText('READY', x + slotW - 8, y + 66);
      ctx.textAlign = 'left';
    }
  }
}

function updateDust(dt) {
  for (const p of state.dust) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life += dt * 0.4;
    if (p.life > 1 || p.x < -5 || p.x > W + 5 || p.y < -5 || p.y > PLAY_BOTTOM + 5) {
      p.life = 0;
      p.x = rand(0, W);
      p.y = rand(0, PLAY_BOTTOM);
      p.vx = rand(-10, 10);
      p.vy = rand(-3, 3);
    }
  }
}

function updateHUD() {
  const alive = state.units.filter(u => !u.dead).length;
  document.getElementById('survCount').textContent = alive;
  document.getElementById('killCount').textContent = state.kills;
  document.getElementById('waveNum').textContent = state.wave;

  const bar = document.getElementById('timeBar');
  const label = document.getElementById('timeLabel');
  bar.classList.remove('flowing', 'paused');
  if (state.manualPause) {
    bar.classList.add('paused');
    label.textContent = 'TIME x0 — PRESS + TO RESUME';
  } else if (state.timeFlow < 0.5) {
    bar.classList.add('paused');
    label.textContent = 'TIME x0 — MOVE OR PRESS +';
  } else {
    bar.classList.add('flowing');
    const speedLabel = state.timeSpeed > 0 ? state.timeSpeed : 1;
    label.textContent = `TIME x${speedLabel}`;
  }
}

// ==================== GAME LOOP ====================
let lastTime = performance.now();
function frame(now) {
  const realDt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  const anyMoving = state.units.some(u => !u.dead && u.moving);
  const targetFlow = state.gameOver || state.manualPause ? 0
                   : state.timeSpeed > 0 ? state.timeSpeed
                   : anyMoving ? 1
                   : 0;
  state.timeFlow += (targetFlow - state.timeFlow) * Math.min(1, realDt * 12);
  const gameDt = realDt * state.timeFlow;

  state.time += realDt;
  updateDust(realDt);
  if (state.shake > 0) state.shake = Math.max(0, state.shake - realDt * 18);

  for (const m of state.moveMarkers) m.life -= realDt;
  state.moveMarkers = state.moveMarkers.filter(m => m.life > 0);

  for (const b of state.bolts) b.life -= realDt;
  state.bolts = state.bolts.filter(b => b.life > 0);

  // Loot visual update (bob, pop-in) plays regardless of time freeze
  for (const l of state.loot) l.update(realDt);

  for (const p of state.particles) {
    const d = p.realtime ? realDt : gameDt;
    p.x += p.vx * d;
    p.y += p.vy * d;
    p.vy += 220 * d;
    p.life -= d;
  }
  state.particles = state.particles.filter(p => p.life > 0);

  if (gameDt > 0 && !state.gameOver) {
    state.survivedSeconds += gameDt;
    for (const u of state.units) u.update(gameDt);
    for (const e of state.enemies) e.update(gameDt);

    // Projectiles
    for (const pr of state.projectiles) pr.update(gameDt);
    state.projectiles = state.projectiles.filter(pr => !pr.dead);

    // Loot pickup (visual update happens later regardless of timeFlow)
    for (const l of state.loot) {
      if (l.picked) continue;
      for (const u of state.units) {
        if (u.dead) continue;
        if (dist2(u.x, u.y, l.x, l.y) < u.r + l.r + 2) {
          l.picked = true;
          applyLoot(l, u);
          break;
        }
      }
    }
    state.loot = state.loot.filter(l => !l.picked);

    // Explosions (driven by gameDt for shockwave timing)
    for (const ex of state.explosions) {
      ex.life -= gameDt;
      ex.r += (ex.maxR - ex.r) * Math.min(1, gameDt * 8);
    }
    state.explosions = state.explosions.filter(ex => ex.life > 0);

    // Boss shockwaves - thin damaging ring expanding outward
    for (const sw of state.shockwaves) {
      const prevR = sw.r;
      sw.r += sw.speed * gameDt;
      sw.life -= gameDt;
      // Damage units crossed by the ring
      for (const u of state.units) {
        if (u.dead || sw.hit.has(u)) continue;
        const d = dist2(sw.x, sw.y, u.x, u.y);
        if (d > prevR - 8 && d < sw.r + 8) {
          u.hp -= sw.dmg;
          u.hurtFlash = 1;
          sw.hit.add(u);
          const ang = Math.atan2(u.y - sw.y, u.x - sw.x);
          // visceral hit particles
          for (let i = 0; i < 10; i++) {
            state.particles.push({
              x: u.x + rand(-3, 3), y: u.y + rand(-3, 3),
              vx: Math.cos(ang) * rand(80, 160) + rand(-40, 40),
              vy: Math.sin(ang) * rand(80, 160) + rand(-80, -10),
              life: rand(0.3, 0.7), maxLife: 0.7,
              color: '#a83a2a', size: rand(1.2, 2.5), realtime: true,
            });
          }
          state.shake = Math.max(state.shake, 5);
        }
      }
      if (sw.r > sw.maxR) sw.life = 0;
    }
    state.shockwaves = state.shockwaves.filter(sw => sw.life > 0);

    for (const e of state.enemies) {
      if (e.dead && e.deathTimer < 0.1 && e.deathTimer + gameDt >= 0.1) {
        state.bloodStains.push({ x: e.x, y: e.y + 2, r: e.r * 1.4, rot: rand(0, Math.PI), a: 0.55 });
        if (state.bloodStains.length > 40) state.bloodStains.shift();
      }
    }

    state.enemies = state.enemies.filter(e => !(e.dead && e.deathTimer > 3));

    for (const u of state.units) {
      if (u.hp <= 0 && !u.dead) {
        u.dead = true;
        const idx = state.selected.indexOf(u);
        if (idx >= 0) state.selected.splice(idx, 1);
        u.selected = false;
        state.bloodStains.push({ x: u.x, y: u.y + 2, r: u.r * 1.8, rot: rand(0, Math.PI), a: 0.6 });
        for (let i = 0; i < 25; i++) {
          state.particles.push({
            x: u.x, y: u.y,
            vx: rand(-130, 130), vy: rand(-160, -20),
            life: rand(0.7, 1.5), maxLife: 1.5,
            color: '#8a2a1a', size: rand(1.5, 3), realtime: true,
          });
        }
        state.shake = Math.max(state.shake, 7);
      }
    }

    state.spawnTimer -= gameDt;
    if (state.spawnTimer <= 0) {
      spawnEnemy();
      // Burst spawns at higher waves to keep pressure up despite loot
      if (state.wave >= 3 && Math.random() < 0.35) spawnEnemy();
      if (state.wave >= 6 && Math.random() < 0.35) spawnEnemy();
      state.spawnTimer = state.spawnInterval * rand(0.7, 1.3);
    }

    state.waveTimer += gameDt;
    if (state.waveTimer > 22) {
      state.waveTimer = 0;
      if (state.wave < 21) {
        state.wave++;
        state.spawnInterval = Math.max(0.30, state.spawnInterval * 0.84);
        // Boss spawning - bigboss takes priority on overlap (waves 36, 72...)
        let bossLabel = null;
        if (state.wave % 9 === 0) {
          spawnBoss('bigboss');
          bossLabel = 'BEHEMOTH AWAKENS';
        } else if (state.wave % 4 === 0) {
          spawnBoss('miniboss');
          bossLabel = 'A WARLORD ARRIVES';
        }
        state.moveMarkers.push({
          x: W / 2, y: PLAY_BOTTOM / 2, life: 1.6, maxLife: 1.6,
          type: 'wave', bossLabel,
        });
      } else {
        // Wave 21 complete — Victory!
        state.gameOver = true;
        state.victory = true;
        const total = Math.floor(state.survivedSeconds);
        document.getElementById('gameOverText').textContent = 'YOU SURVIVED';
        document.getElementById('gameOverText').classList.add('victory');
        document.getElementById('finalStats').textContent =
          `ALL 21 WAVES CLEARED · KILLS ${state.kills} · TIME ${total}s`;
        document.getElementById('overlay').classList.add('show');
      }
    }

    if (state.units.every(u => u.dead)) {
      state.gameOver = true;
      const total = Math.floor(state.survivedSeconds);
      document.getElementById('finalStats').textContent =
        `SURVIVED ${total}s · KILLS ${state.kills} · WAVE ${state.wave}`;
      document.getElementById('overlay').classList.add('show');
    }
  }

  // ==== DRAW ====
  ctx.save();
  if (state.shake > 0) ctx.translate(rand(-state.shake, state.shake), rand(-state.shake, state.shake));

  drawBackground();

  for (const m of state.moveMarkers) {
    if (m.type === 'wave') continue;
    const t = 1 - m.life / m.maxLife;
    if (m.type === 'heal' || m.type === 'stim') {
      const alpha = Math.min(1, m.life / m.maxLife * 1.4);
      const yFloat = m.y - t * 20;
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = m.type === 'heal'
        ? `rgba(120, 230, 140, ${alpha})`
        : `rgba(255, 130, 90, ${alpha})`;
      ctx.fillText(m.text || '', m.x, yFloat);
      ctx.textAlign = 'left';
      continue;
    }
    ctx.strokeStyle = m.type === 'attack'
      ? `rgba(220, 80, 60, ${1 - t})`
      : `rgba(180, 220, 130, ${1 - t})`;
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 4 + t * 14, 0, Math.PI * 2);
    ctx.stroke();
    if (m.type === 'attack') {
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(m.x - 8, m.y); ctx.lineTo(m.x + 8, m.y);
      ctx.moveTo(m.x, m.y - 8); ctx.lineTo(m.x, m.y + 8);
      ctx.stroke();
    }
  }

  const drawables = [];
  for (const u of state.units) if (!u.dead) drawables.push(u);
  for (const e of state.enemies) if (!e.dead) drawables.push(e);
  drawables.sort((a, b) => a.y - b.y);

  for (const e of state.enemies) if (e.dead) e.draw(ctx);

  // Loot drawn under units, on the ground
  for (const l of state.loot) l.draw(ctx);

  for (const ent of drawables) ent.draw(ctx);

  // Projectiles fly above units
  for (const pr of state.projectiles) pr.draw(ctx);

  drawBolts();

  // Explosions on top
  for (const ex of state.explosions) {
    const t = 1 - ex.life / ex.maxLife;
    const alpha = ex.life / ex.maxLife;
    // shockwave ring
    ctx.strokeStyle = `rgba(255, 220, 140, ${alpha * 0.85})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(255, 140, 60, ${alpha * 0.5})`;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(ex.x, ex.y, ex.r * 0.85, 0, Math.PI * 2);
    ctx.stroke();
    // central flash
    if (t < 0.4) {
      const fa = 1 - t / 0.4;
      ctx.fillStyle = `rgba(255, 240, 200, ${fa * 0.5})`;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.maxR * 0.6 * fa, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Boss shockwave rings
  for (const sw of state.shockwaves) {
    const alpha = Math.min(1, sw.life / sw.maxLife);
    ctx.strokeStyle = `rgba(255, 220, 80, ${alpha * 0.85})`;
    ctx.lineWidth = 5;
    ctx.shadowColor = '#ffe060';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(180, 240, 80, ${alpha * 0.6})`;
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.r - 4, 0, Math.PI * 2);
    ctx.stroke();
    // dust kicked up at the ring's leading edge
    if (Math.random() < 0.6) {
      const a = rand(0, Math.PI * 2);
      state.particles.push({
        x: sw.x + Math.cos(a) * sw.r,
        y: sw.y + Math.sin(a) * sw.r,
        vx: Math.cos(a) * rand(40, 100),
        vy: Math.sin(a) * rand(40, 100) - 30,
        life: rand(0.3, 0.6), maxLife: 0.6,
        color: '#5a4a3a', size: rand(1.5, 3), realtime: true,
      });
    }
  }

  for (const p of state.particles) {
    const a = Math.min(1, p.life / 0.3);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  if (state.selectionBox) {
    const b = state.selectionBox;
    const x = Math.min(b.x1, b.x2), y = Math.min(b.y1, b.y2);
    const w = Math.abs(b.x2 - b.x1), h = Math.abs(b.y2 - b.y1);
    ctx.fillStyle = 'rgba(180, 220, 130, 0.14)';
    ctx.strokeStyle = 'rgba(180, 220, 130, 0.9)';
    ctx.lineWidth = 1;
    ctx.fillRect(x, y, w, h);
    ctx.strokeRect(x, y, w, h);
  }

  ctx.restore();

  if (state.timeFlow < 1) {
    const pauseAmount = 1 - state.timeFlow;
    ctx.fillStyle = `rgba(60, 40, 90, ${pauseAmount * 0.18})`;
    ctx.fillRect(0, 0, W, PLAY_BOTTOM + 8);
    if (pauseAmount > 0.5) {
      ctx.strokeStyle = `rgba(180, 160, 220, ${(pauseAmount - 0.5) * 0.08})`;
      ctx.lineWidth = 1;
      for (let i = 0; i < PLAY_BOTTOM; i += 4) {
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(W, i);
        ctx.stroke();
      }
    }
  }

  for (const m of state.moveMarkers) {
    if (m.type !== 'wave') continue;
    const t = 1 - m.life / m.maxLife;
    const alpha = m.life > 0.3 ? Math.min(1, (m.maxLife - m.life) * 3) : m.life * 3;
    const isBoss = !!m.bossLabel;
    const isBig = m.bossLabel === 'BEHEMOTH AWAKENS';
    const titleColor = isBig ? `rgba(180, 240, 90, ${alpha})`
                     : isBoss ? `rgba(255, 130, 60, ${alpha})`
                     : `rgba(200, 60, 40, ${alpha * 0.9})`;
    ctx.fillStyle = titleColor;
    ctx.font = `bold ${isBoss ? 46 : 42}px Georgia, serif`;
    ctx.textAlign = 'center';
    const y = m.y - t * 20;
    if (isBoss) {
      ctx.shadowColor = isBig ? '#a0ff40' : '#ff6020';
      ctx.shadowBlur = 12;
    }
    ctx.fillText(`WAVE ${state.wave}`, m.x, y);
    ctx.shadowBlur = 0;
    ctx.font = '14px "Courier New", monospace';
    ctx.fillStyle = isBoss
      ? (isBig ? `rgba(220, 255, 160, ${alpha * 0.9})` : `rgba(255, 200, 140, ${alpha * 0.9})`)
      : `rgba(200, 180, 140, ${alpha * 0.7})`;
    ctx.fillText(m.bossLabel || 'the horde grows', m.x, y + 24);
    ctx.textAlign = 'left';
  }

  drawAbilityPanel();

  updateHUD();
  requestAnimationFrame(frame);
}

generateTerrain();
newGame();
requestAnimationFrame(frame);
</script>
