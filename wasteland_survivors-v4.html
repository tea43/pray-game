<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wasteland Survivors</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0604;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #d9c7a0;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #frame {
    position: relative;
    background: #1a120a;
    box-shadow: 0 0 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.6);
    border: 2px solid #2a1a0a;
  }
  canvas {
    display: block;
    background: #6b5335;
    cursor: crosshair;
    image-rendering: crisp-edges;
  }
  .hud {
    position: absolute;
    padding: 6px 10px;
    background: rgba(10, 6, 4, 0.75);
    border: 1px solid #3a2a18;
    color: #d9c7a0;
    font-size: 12px;
    letter-spacing: 1px;
    pointer-events: none;
    user-select: none;
  }
  #hudTL { top: 10px; left: 10px; }
  #hudTR { top: 10px; right: 10px; text-align: right; }
  #timeBar {
    bottom: 100px; left: 10px;
    min-width: 220px;
  }
  #controls {
    bottom: 10px; right: 10px;
    font-size: 10px;
    line-height: 1.6;
    color: #a89470;
    text-align: right;
    background: rgba(10, 6, 4, 0.65);
  }
  #title {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Georgia', serif;
    font-size: 14px;
    letter-spacing: 4px;
    color: #8a6b3a;
    border: none;
    background: none;
  }
  .flow-indicator {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    background: #c5a572;
    transition: background 0.2s;
  }
  .flowing .flow-indicator { background: #8bc34a; box-shadow: 0 0 8px #8bc34a; }
  .paused .flow-indicator { background: #c5a572; }
  #overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(10, 5, 2, 0.85);
    pointer-events: none;
  }
  #overlay.show { display: flex; pointer-events: auto; }
  #gameOverText {
    font-family: 'Georgia', serif;
    font-size: 40px;
    color: #a83a2a;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #000, 0 2px 0 #000;
    margin-bottom: 20px;
  }
  #finalStats {
    color: #d9c7a0;
    font-size: 14px;
    margin-bottom: 28px;
    letter-spacing: 2px;
  }
  #restart {
    padding: 10px 28px;
    background: #2a1a0a;
    border: 1px solid #8a6b3a;
    color: #d9c7a0;
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.15s;
  }
  #restart:hover {
    background: #3a2a1a;
    border-color: #c5a572;
    color: #fff;
  }
  #gameOverText.victory {
    color: #a0d040;
    text-shadow: 0 0 30px #60a010, 0 2px 0 #000;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game"></canvas>
    <div class="hud" id="title">W A S T E L A N D &nbsp; S U R V I V O R S</div>
    <div class="hud" id="hudTL">SURVIVORS: <span id="survCount">3</span>/3 &nbsp;&nbsp; KILLS: <span id="killCount">0</span></div>
    <div class="hud" id="hudTR">WAVE <span id="waveNum">1</span> / 21</div>
    <div class="hud paused" id="timeBar"><span class="flow-indicator"></span><span id="timeLabel">TIME PAUSED — MOVE TO ADVANCE</span></div>
    <div class="hud" id="controls">
      LEFT-CLICK: select &nbsp;&middot;&nbsp; DRAG: box-select<br>
      RIGHT-CLICK: move / attack &nbsp;&middot;&nbsp; SHIFT: add<br>
      S: stop &nbsp;&middot;&nbsp; CTRL+A: all &nbsp;&middot;&nbsp; +/-: speed &nbsp;&middot;&nbsp; SPACE: x0
    </div>
    <div id="overlay">
      <div id="gameOverText">ALL SURVIVORS DEAD</div>
      <div id="finalStats"></div>
      <button id="restart">RESTART</button>
    </div>
  </div>
</div>

<script>
// ==================== SETUP ====================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = Math.floor(window.innerWidth  * 0.97);
  canvas.height = Math.floor(window.innerHeight * 0.97);
}
resizeCanvas();

let W = canvas.width, H = canvas.height;

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const dist2 = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const PANEL_H = 74;
let PLAY_BOTTOM = H - PANEL_H - 24;

window.addEventListener('resize', () => {
  resizeCanvas();
  W = canvas.width;
  H = canvas.height;
  PLAY_BOTTOM = H - PANEL_H - 24;
  generateTerrain();
});

// ==================== UNIT ====================
class Unit {
  constructor(x, y, type) {
    this.x = x; this.y = y;
    this.tx = x; this.ty = y;
    this.r = 11;
    this.speed = 78;
    this.hp = 100; this.maxHp = 100;
    this.atkRange = 36;
    this.baseAtkDmg = 32;
    this.baseAtkRate = 0.55;
    this.atkCd = 0;
    this.selected = false;
    this.swing = 0;
    this.facing = 0;
    this.walkCycle = 0;
    this.dead = false;
    this.aggroTarget = null;
    this.hurtFlash = 0;

    this.type = type;
    this.abilityCd = 0;
    this.rageTimer = 0;
    this.blinkFlash = 0;
    this.dualSide = false;
    this.throwArm = 0; // animation for throw
    this.activeWeapon = null;   // 'spray_gun' | 'samurai_sword' | null
    this.activeWeaponTimer = 0; // seconds remaining

    if (type === 'elliot') {
      this.name = 'Elliot';
      this.abilityKey = 'Q';
      this.abilityName = 'BLINK';
      this.abilityMaxCd = 6;
      this.abilityColor = '#80c8ff';
      this.weaponType = 'longClub';
      this.atkRange = 56;
      this.palette = {
        shirt: '#d94a78', acc1: '#f5d04a', acc2: '#40c8c0', acc3: '#f8f0d0',
        shorts: '#8a6840', skin: '#e8b888',
        hat: '#d4b880', hatTop: '#bfa270', hatBand: '#5a3a1a',
      };
    } else if (type === 'dikiy') {
      this.name = 'Dikiy';
      this.abilityKey = 'W';
      this.abilityName = 'RAGE';
      this.abilityMaxCd = 12;
      this.abilityColor = '#ff6040';
      this.maxHp = 120; this.hp = 120;
      this.weaponType = 'dualClubs';
      this.baseAtkDmg = 24;
      this.baseAtkRate = 0.34;
      this.palette = {
        skin: '#d8a878', skinShade: '#a8784a', skinDark: '#7a5030',
        cap: '#2a1a0a', capTop: '#3a2515', capBtn: '#c53030',
      };
    } else if (type === 'dick') {
      this.name = 'Dick';
      this.abilityKey = 'E';
      this.abilityName = 'CHAIN LTG';
      this.abilityMaxCd = 8;
      this.abilityColor = '#c8a0ff';
      this.weaponType = 'thrownClub';
      this.atkRange = 220;
      this.baseAtkDmg = 36;
      this.baseAtkRate = 0.9;
      this.palette = {
        shirt: '#ece8dc', shirtShade: '#b8b0a0',
        shorts: '#c53030', shortsShade: '#8a1e1e',
        skin: '#d4a878', hair: '#3a2a15',
      };
    }
  }

  get atkDmg() {
    let dmg = this.rageTimer > 0 ? this.baseAtkDmg * 2 : this.baseAtkDmg;
    if (this.activeWeapon === 'samurai_sword') dmg *= 2.2;
    return dmg;
  }
  get atkRate() {
    let rate = this.rageTimer > 0 ? this.baseAtkRate * 0.4 : this.baseAtkRate;
    if (this.activeWeapon === 'spray_gun') rate *= 0.25;
    return rate;
  }
  get moving() { return dist2(this.x, this.y, this.tx, this.ty) > 2.5; }

  update(dt) {
    if (this.dead) return;

    this.rageTimer = Math.max(0, this.rageTimer - dt);
    this.abilityCd = Math.max(0, this.abilityCd - dt);
    if (this.activeWeaponTimer > 0) {
      this.activeWeaponTimer -= dt;
      if (this.activeWeaponTimer <= 0) {
        this.activeWeapon = null;
        this.activeWeaponTimer = 0;
      }
    }

    if (this.moving) {
      const dx = this.tx - this.x, dy = this.ty - this.y;
      const d = Math.hypot(dx, dy);
      this.facing = Math.atan2(dy, dx);
      const step = this.speed * dt;
      if (step >= d) { this.x = this.tx; this.y = this.ty; }
      else { this.x += (dx / d) * step; this.y += (dy / d) * step; }
      this.walkCycle += dt * 9;
    }

    this.atkCd -= dt;
    this.hurtFlash = Math.max(0, this.hurtFlash - dt * 5);
    this.swing = Math.max(0, this.swing - dt * 6);
    this.blinkFlash = Math.max(0, this.blinkFlash - dt * 2.5);
    this.throwArm = Math.max(0, this.throwArm - dt * 4);

    let target = null;
    if (this.aggroTarget && !this.aggroTarget.dead) {
      const d = dist2(this.x, this.y, this.aggroTarget.x, this.aggroTarget.y);
      if (d < this.atkRange + 40) target = this.aggroTarget;
      else this.aggroTarget = null;
    }
    if (!target) {
      let nd = this.atkRange;
      for (const e of state.enemies) {
        if (e.dead) continue;
        const d = dist2(this.x, this.y, e.x, e.y);
        if (d < nd) { nd = d; target = e; }
      }
    }

    if (target && dist2(this.x, this.y, target.x, target.y) < this.atkRange && this.atkCd <= 0) {
      this.attack(target);
    }
  }

  attack(enemy) {
    this.atkCd = this.atkRate;
    this.facing = Math.atan2(enemy.y - this.y, enemy.x - this.x);
    this.swing = 1;

    // === SPRAY GUN: 5-bullet spread cone ===
    if (this.activeWeapon === 'spray_gun') {
      this.throwArm = 1;
      const spread = 0.35; // radians half-angle
      const bulletCount = 5;
      for (let i = 0; i < bulletCount; i++) {
        const angleOffset = (i / (bulletCount - 1) - 0.5) * spread * 2;
        const bulletAng = this.facing + angleOffset;
        const sx = this.x + Math.cos(bulletAng) * (this.r + 6);
        const sy = this.y + Math.sin(bulletAng) * (this.r + 6);
        state.projectiles.push(new SprayBullet(sx, sy, bulletAng, this.atkDmg * 0.5));
      }
      state.shake = Math.max(state.shake, 2.5);
      return;
    }

    // === SAMURAI SWORD: wide cleave hitting all enemies in arc ===
    if (this.activeWeapon === 'samurai_sword') {
      const cleaveRange = 80;
      const halfArc = Math.PI * (60 / 180); // 120° total arc
      let hit = 0;
      for (const e of state.enemies) {
        if (e.dead) continue;
        const d = dist2(this.x, this.y, e.x, e.y);
        if (d > cleaveRange + e.r) continue;
        const angToE = Math.atan2(e.y - this.y, e.x - this.x);
        let diff = angToE - this.facing;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) > halfArc) continue;
        e.hp -= this.atkDmg;
        e.knockX += Math.cos(this.facing) * 120;
        e.knockY += Math.sin(this.facing) * 120;
        e.hurtFlash = 1;
        for (let i = 0; i < 8; i++) {
          state.particles.push({
            x: e.x + rand(-3, 3), y: e.y + rand(-3, 3),
            vx: rand(-80, 80), vy: rand(-100, -10),
            life: rand(0.3, 0.6), maxLife: 0.6,
            color: '#e8d080', size: rand(1.2, 2.5), realtime: true,
          });
        }
        hit++;
      }
      state.shake = Math.max(state.shake, hit > 1 ? 6 : 3);
      return;
    }

    if (this.weaponType === 'thrownClub') {
      this.throwArm = 1;
      const dmg = this.atkDmg;
      const sx = this.x + Math.cos(this.facing) * (this.r + 6);
      const sy = this.y + Math.sin(this.facing) * (this.r + 6);
      state.projectiles.push(new Projectile(sx, sy, enemy, dmg, this.facing));
      state.shake = Math.max(state.shake, 1.5);
      return;
    }

    if (this.weaponType === 'dualClubs') {
      this.dualSide = !this.dualSide;
    }

    const dmg = this.atkDmg;
    enemy.hp -= dmg;
    const kb = this.rageTimer > 0 ? 140 : 80;
    enemy.knockX += Math.cos(this.facing) * kb;
    enemy.knockY += Math.sin(this.facing) * kb;
    enemy.hurtFlash = 1;
    const hitCount = this.rageTimer > 0 ? 14 : 10;
    for (let i = 0; i < hitCount; i++) {
      state.particles.push({
        x: enemy.x + rand(-3, 3), y: enemy.y + rand(-3, 3),
        vx: rand(-90, 90), vy: rand(-110, -10),
        life: rand(0.3, 0.7), maxLife: 0.7,
        color: enemy.bloodColor, size: rand(1.2, 2.8), realtime: true,
      });
    }
    state.shake = Math.max(state.shake, this.rageTimer > 0 ? 5 : 3);
  }

  moveTo(x, y) {
    this.tx = clamp(x, 6, W - 6);
    this.ty = clamp(y, 6, PLAY_BOTTOM);
    this.aggroTarget = null;
  }
  attackMove(enemy) {
    this.aggroTarget = enemy;
    this.tx = clamp(enemy.x, 6, W - 6);
    this.ty = clamp(enemy.y, 6, PLAY_BOTTOM);
  }
  stop() { this.tx = this.x; this.ty = this.y; this.aggroTarget = null; }

  cast() {
    if (this.dead || this.abilityCd > 0) return false;
    if (this.type === 'elliot') return this._blink();
    if (this.type === 'dikiy') return this._rage();
    if (this.type === 'dick') return this._chainLightning();
    return false;
  }

  _blink() {
    const mx = state.mouse.x, my = state.mouse.y;
    const dx = mx - this.x, dy = my - this.y;
    const d = Math.hypot(dx, dy);
    if (d < 6) return false;
    const maxRange = 240;
    const step = Math.min(d, maxRange);
    for (let i = 0; i < 22; i++) {
      state.particles.push({
        x: this.x, y: this.y,
        vx: rand(-100, 100), vy: rand(-100, 100),
        life: rand(0.35, 0.7), maxLife: 0.7,
        color: '#80c8ff', size: rand(1.5, 3), realtime: true,
      });
    }
    const nx = clamp(this.x + (dx / d) * step, 6, W - 6);
    const ny = clamp(this.y + (dy / d) * step, 6, PLAY_BOTTOM);
    const steps = 8;
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      state.particles.push({
        x: this.x + (nx - this.x) * t, y: this.y + (ny - this.y) * t,
        vx: 0, vy: 0,
        life: 0.3, maxLife: 0.3,
        color: '#a0d8ff', size: 2.5, realtime: true,
      });
    }
    this.x = nx; this.y = ny;
    this.tx = nx; this.ty = ny;
    this.blinkFlash = 1;
    for (let i = 0; i < 22; i++) {
      state.particles.push({
        x: this.x, y: this.y,
        vx: rand(-100, 100), vy: rand(-100, 100),
        life: rand(0.35, 0.7), maxLife: 0.7,
        color: '#80c8ff', size: rand(1.5, 3), realtime: true,
      });
    }
    this.abilityCd = this.abilityMaxCd;
    state.shake = Math.max(state.shake, 2);
    return true;
  }

  _rage() {
    this.rageTimer = 5;
    this.abilityCd = this.abilityMaxCd;
    for (let i = 0; i < 28; i++) {
      state.particles.push({
        x: this.x, y: this.y,
        vx: rand(-80, 80), vy: rand(-110, -20),
        life: rand(0.5, 1.1), maxLife: 1.1,
        color: i % 2 ? '#ff3020' : '#ff8030',
        size: rand(1.5, 3), realtime: true,
      });
    }
    state.shake = Math.max(state.shake, 4);
    return true;
  }

  _chainLightning() {
    const chains = 4;
    const maxRange = 200;
    let cx = this.x, cy = this.y;
    const hit = new Set();
    const points = [{ x: cx, y: cy }];
    for (let i = 0; i < chains; i++) {
      let nearest = null, nd = maxRange;
      for (const e of state.enemies) {
        if (e.dead || hit.has(e)) continue;
        const d = dist2(cx, cy, e.x, e.y);
        if (d < nd) { nd = d; nearest = e; }
      }
      if (!nearest) break;
      hit.add(nearest);
      points.push({ x: nearest.x, y: nearest.y });
      nearest.hp -= 30;
      nearest.stunTimer = Math.max(nearest.stunTimer, 1.8);
      nearest.hurtFlash = 1;
      nearest.knockX += rand(-30, 30);
      nearest.knockY += rand(-30, 30);
      for (let j = 0; j < 10; j++) {
        state.particles.push({
          x: nearest.x, y: nearest.y,
          vx: rand(-100, 100), vy: rand(-120, -20),
          life: rand(0.3, 0.7), maxLife: 0.7,
          color: j % 2 ? '#a0e0ff' : '#e0f0ff',
          size: rand(1.2, 2.5), realtime: true,
        });
      }
      cx = nearest.x; cy = nearest.y;
    }
    if (points.length > 1) {
      state.bolts.push({ points, life: 0.4, maxLife: 0.4 });
    }
    this.abilityCd = this.abilityMaxCd;
    state.shake = Math.max(state.shake, 5);
    return true;
  }

  draw(ctx) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(this.x, this.y + this.r - 1, this.r * 0.85, this.r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();

    if (this.blinkFlash > 0) {
      ctx.strokeStyle = `rgba(128, 200, 255, ${this.blinkFlash})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + 14 * (1 - this.blinkFlash), 0, Math.PI * 2);
      ctx.stroke();
    }

    if (this.rageTimer > 0) {
      const pulse = 0.5 + Math.sin(state.time * 14) * 0.5;
      const fade = Math.min(1, this.rageTimer / 0.4);
      ctx.strokeStyle = `rgba(255, 60, 30, ${(0.35 + pulse * 0.4) * fade})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + 4 + pulse * 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 180, 60, ${0.55 * fade})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + 1.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (this.selected && this.moving) {
      ctx.strokeStyle = 'rgba(180, 220, 130, 0.35)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(this.x, this.y);
      ctx.lineTo(this.tx, this.ty);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    if (this.selected) {
      const pulse = 1 + Math.sin(state.time * 5) * 0.08;
      ctx.strokeStyle = 'rgba(180, 220, 130, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(this.x, this.y + this.r - 1, (this.r + 5) * pulse, (this.r + 5) * 0.4 * pulse, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    const wobble = this.moving ? Math.sin(this.walkCycle) * 1.2 : 0;
    const flashBoost = this.hurtFlash > 0 ? this.hurtFlash : 0;

    ctx.save();
    ctx.translate(this.x, this.y + wobble);

    if (this.type === 'elliot') this._drawElliot(ctx, flashBoost);
    else if (this.type === 'dikiy') this._drawDikiy(ctx, flashBoost);
    else if (this.type === 'dick') this._drawDick(ctx, flashBoost);

    ctx.restore();

    // Dick's ambient electric sparks (in world space)
    if (this.type === 'dick' && Math.random() < 0.06) {
      const a = rand(0, Math.PI * 2);
      const r = this.r + rand(1, 4);
      ctx.strokeStyle = 'rgba(200, 230, 255, 0.75)';
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(a) * r, this.y + Math.sin(a) * r);
      ctx.lineTo(this.x + Math.cos(a) * (r + rand(3, 7)) + rand(-2, 2),
                 this.y + Math.sin(a) * (r + rand(3, 7)) + rand(-2, 2));
      ctx.stroke();
    }

    // Weapon - dispatched by weapon type
    this._drawWeapon(ctx);

    if (this.swing > 0.3 && this.weaponType !== 'thrownClub') {
      const swingArc = this.swing > 0 ? Math.sin((1 - this.swing) * Math.PI) * 2.2 - 1.1 : 0;
      const clubBase = this.facing - 0.4 + swingArc;
      const a = (this.swing - 0.3) * 0.8;
      ctx.strokeStyle = `rgba(230, 220, 200, ${a})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 22, clubBase - 1.4, clubBase + 0.4);
      ctx.stroke();
    }

    const barW = 24, barH = 3.5;
    const barX = this.x - barW / 2;
    const barY = this.y - this.r - 11;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
    const hpPct = this.hp / this.maxHp;
    ctx.fillStyle = hpPct > 0.5 ? '#7aa853' : hpPct > 0.25 ? '#c5a247' : '#a83a2a';
    ctx.fillRect(barX, barY, barW * hpPct, barH);

    // Active special weapon ring + timer
    if (this.activeWeapon) {
      const wColor = this.activeWeapon === 'spray_gun' ? '#ff9a30'
                   : this.activeWeapon === 'samurai_sword' ? '#e8e060'
                   : '#d060ff';
      const pulse = 0.6 + Math.sin(state.time * 8) * 0.4;
      ctx.strokeStyle = wColor.replace(')', `, ${pulse})`).replace('rgb', 'rgba').replace('#', 'rgba(').replace('rgba(', 'rgba(');
      // simpler: just use direct rgba
      ctx.strokeStyle = this.activeWeapon === 'spray_gun'
        ? `rgba(255, 154, 48, ${pulse})`
        : `rgba(232, 224, 96, ${pulse})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.font = 'bold 8px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.fillStyle = this.activeWeapon === 'spray_gun' ? '#ff9a30' : '#e8e060';
      const label = this.activeWeapon === 'spray_gun' ? '🔫' : '⚔';
      ctx.fillText(`${label} ${this.activeWeaponTimer.toFixed(0)}s`, this.x, barY - 4);
      ctx.textAlign = 'left';
    }
  }

  _drawElliot(ctx, flashBoost) {
    const p = this.palette;
    ctx.fillStyle = p.shorts;
    ctx.beginPath();
    ctx.ellipse(0, this.r * 0.55, this.r * 0.8, this.r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.strokeStyle = '#5a3a20';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.moveTo(-4, this.r * 0.55);
    ctx.lineTo(-4, this.r * 0.75);
    ctx.stroke();

    ctx.fillStyle = flashBoost > 0 ? '#ffa090' : p.shirt;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.fillStyle = p.acc1;
    this._flower(ctx, -4, -3, 1.6);
    this._flower(ctx, 5, 2, 1.4);
    this._flower(ctx, -2, 5, 1.3);
    ctx.fillStyle = p.acc2;
    ctx.beginPath();
    ctx.ellipse(4, -4, 2.2, 1.1, 0.6, 0, Math.PI * 2);
    ctx.ellipse(-5, 3, 2, 1, -0.4, 0, Math.PI * 2);
    ctx.ellipse(2, -1, 1.6, 0.8, 1.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = p.acc3;
    ctx.beginPath();
    ctx.arc(-4, -3, 0.5, 0, Math.PI * 2);
    ctx.arc(5, 2, 0.4, 0, Math.PI * 2);
    ctx.arc(-2, 5, 0.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.arc(2, 3, this.r * 0.9, -0.3, 1.8);
    ctx.lineTo(0, 0);
    ctx.fill();

    ctx.strokeStyle = 'rgba(120, 30, 60, 0.6)';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.25, this.r * 0.35, 0.4, Math.PI - 0.4);
    ctx.stroke();

    ctx.fillStyle = flashBoost > 0 ? '#ffcaba' : p.skin;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.6, this.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.stroke();

    ctx.fillStyle = p.hat;
    ctx.beginPath();
    ctx.ellipse(0, -this.r * 0.58, this.r * 0.88, this.r * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5a3a1a';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.fillStyle = p.hatTop;
    ctx.beginPath();
    ctx.ellipse(0, -this.r * 0.82, this.r * 0.55, this.r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = p.hatBand;
    ctx.fillRect(-this.r * 0.55, -this.r * 0.66, this.r * 1.1, 1.6);

    ctx.fillStyle = '#1a0f06';
    ctx.fillRect(-2.5, -this.r * 0.48, 1.3, 1);
    ctx.fillRect(1.2, -this.r * 0.48, 1.3, 1);
    ctx.strokeStyle = '#6a3020';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.38, 1.2, 0.3, Math.PI - 0.3);
    ctx.stroke();
  }

  _flower(ctx, cx, cy, r) {
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * r * 0.6, cy + Math.sin(a) * r * 0.6, r * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  _drawDikiy(ctx, flashBoost) {
    const p = this.palette;
    ctx.fillStyle = p.skinDark;
    ctx.beginPath();
    ctx.ellipse(0, this.r * 0.6, this.r * 0.7, this.r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = flashBoost > 0 ? '#ffb8a0' : p.skin;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Muscle definition
    ctx.strokeStyle = p.skinShade;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(0, -this.r * 0.45);
    ctx.lineTo(0, this.r * 0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(-this.r * 0.25, -this.r * 0.05, this.r * 0.3, 0, Math.PI, false);
    ctx.arc(this.r * 0.25, -this.r * 0.05, this.r * 0.3, 0, Math.PI, false);
    ctx.stroke();
    ctx.strokeStyle = p.skinShade;
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(-2, this.r * 0.25); ctx.lineTo(2, this.r * 0.25);
    ctx.moveTo(-2, this.r * 0.45); ctx.lineTo(2, this.r * 0.45);
    ctx.stroke();

    ctx.fillStyle = p.skinShade;
    ctx.beginPath();
    ctx.arc(-3, -this.r * 0.15, 0.7, 0, Math.PI * 2);
    ctx.arc(3, -this.r * 0.15, 0.7, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(50, 30, 15, 0.5)';
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(rand(-3, 3), rand(-2, 2), 0.7, 0.7);
    }

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.arc(2, 3, this.r * 0.9, -0.3, 1.8);
    ctx.lineTo(0, 0);
    ctx.fill();

    // Cap bill rotates with facing
    ctx.save();
    ctx.translate(0, -this.r * 0.6);
    ctx.rotate(this.facing);
    ctx.fillStyle = p.cap;
    ctx.beginPath();
    ctx.ellipse(this.r * 0.45, 0, this.r * 0.38, this.r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0604';
    ctx.lineWidth = 0.6;
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = flashBoost > 0 ? '#ffcaba' : p.skin;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.6, this.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.stroke();

    ctx.fillStyle = p.cap;
    ctx.beginPath();
    ctx.ellipse(0, -this.r * 0.78, this.r * 0.55, this.r * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0604';
    ctx.lineWidth = 0.7;
    ctx.stroke();
    ctx.fillStyle = p.capTop;
    ctx.beginPath();
    ctx.ellipse(-1, -this.r * 0.88, this.r * 0.3, this.r * 0.12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = p.capBtn;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.92, 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = this.rageTimer > 0 ? '#ff4020' : '#1a0f06';
    if (this.rageTimer > 0) {
      ctx.shadowColor = '#ff4020';
      ctx.shadowBlur = 4;
    }
    ctx.fillRect(-2.8, -this.r * 0.52, 1.5, 1.2);
    ctx.fillRect(1.3, -this.r * 0.52, 1.5, 1.2);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#2a1a08';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(-3, -this.r * 0.62);
    ctx.lineTo(-1.5, -this.r * 0.58);
    ctx.moveTo(3, -this.r * 0.62);
    ctx.lineTo(1.5, -this.r * 0.58);
    ctx.stroke();
  }

  _drawDick(ctx, flashBoost) {
    const p = this.palette;
    ctx.fillStyle = p.shorts;
    ctx.beginPath();
    ctx.ellipse(0, this.r * 0.55, this.r * 0.88, this.r * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 0.8;
    ctx.stroke();
    ctx.fillStyle = p.shortsShade;
    ctx.beginPath();
    ctx.ellipse(1.5, this.r * 0.7, this.r * 0.7, this.r * 0.14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6a1515';
    ctx.lineWidth = 0.6;
    ctx.beginPath();
    ctx.ellipse(0, this.r * 0.4, this.r * 0.85, this.r * 0.2, 0, Math.PI * 0.15, Math.PI - Math.PI * 0.15);
    ctx.stroke();

    ctx.fillStyle = flashBoost > 0 ? '#ffcabc' : p.shirt;
    ctx.beginPath();
    ctx.arc(0, 0, this.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.fillStyle = p.shirtShade;
    ctx.beginPath();
    ctx.arc(2, 3, this.r * 0.9, -0.3, 1.8);
    ctx.lineTo(0, 0);
    ctx.globalAlpha = 0.45;
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = p.shirtShade;
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(-2.3, -this.r * 0.35);
    ctx.lineTo(0, -this.r * 0.18);
    ctx.lineTo(2.3, -this.r * 0.35);
    ctx.stroke();

    ctx.fillStyle = p.skin;
    ctx.beginPath();
    ctx.arc(-this.r + 1, -0.5, 2.2, 0, Math.PI * 2);
    ctx.arc(this.r - 1, -0.5, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Static sparks when ability ready
    if (this.abilityCd <= 0) {
      ctx.strokeStyle = `rgba(160, 200, 255, ${0.3 + Math.sin(state.time * 8) * 0.2})`;
      ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(-4, -3);
      ctx.lineTo(-2, -1);
      ctx.lineTo(-4, 1);
      ctx.moveTo(3, -2);
      ctx.lineTo(5, 0);
      ctx.lineTo(3, 2);
      ctx.stroke();
    }

    ctx.fillStyle = flashBoost > 0 ? '#ffcaba' : p.skin;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.6, this.r * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1a0f06';
    ctx.stroke();

    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.arc(0, -this.r * 0.8, this.r * 0.5, Math.PI + 0.1, -0.1);
    ctx.fill();
    ctx.fillRect(-1, -this.r * 1.05, 2, 2);

    ctx.fillStyle = '#1a0f06';
    ctx.fillRect(-2.5, -this.r * 0.55, 1.3, 1);
    ctx.fillRect(1.2, -this.r * 0.55, 1.3, 1);
  }

  _drawWeapon(ctx) {
    if (this.weaponType === 'longClub') this._drawLongClub(ctx);
    else if (this.weaponType === 'dualClubs') this._drawDualClubs(ctx);
    else if (this.weaponType === 'thrownClub') this._drawHeldClubs(ctx);
  }

  _drawSingleClub(ctx, baseAng, len, scale) {
    scale = scale || 1;
    const gripX = this.x + Math.cos(baseAng - 0.3) * (this.r * 0.7);
    const gripY = this.y + Math.sin(baseAng - 0.3) * (this.r * 0.7);
    const tipX = gripX + Math.cos(baseAng) * len;
    const tipY = gripY + Math.sin(baseAng) * len;

    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 2.8 * scale;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(gripX, gripY);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    ctx.strokeStyle = '#6b4a20';
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.moveTo(gripX, gripY);
    ctx.lineTo(tipX, tipY);
    ctx.stroke();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 3.5 * scale;
    ctx.beginPath();
    const gx2 = gripX + Math.cos(baseAng) * 5, gy2 = gripY + Math.sin(baseAng) * 5;
    ctx.moveTo(gripX, gripY);
    ctx.lineTo(gx2, gy2);
    ctx.stroke();

    const bladeAng = baseAng + 1.1;
    const bx = tipX + Math.cos(bladeAng) * 7 * scale;
    const by = tipY + Math.sin(bladeAng) * 7 * scale;
    ctx.strokeStyle = '#2a1a08';
    ctx.lineWidth = 3.5 * scale;
    ctx.beginPath();
    ctx.moveTo(tipX, tipY);
    ctx.lineTo(bx, by);
    ctx.stroke();
    ctx.strokeStyle = '#8a6b3a';
    ctx.lineWidth = 1 * scale;
    ctx.beginPath();
    ctx.moveTo(tipX + Math.cos(bladeAng) * 3, tipY + Math.sin(bladeAng) * 3);
    ctx.lineTo(tipX + Math.cos(bladeAng) * 5, tipY + Math.sin(bladeAng) * 5);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  _drawLongClub(ctx) {
    const swingArc = this.swing > 0 ? Math.sin((1 - this.swing) * Math.PI) * 2.4 - 1.2 : 0;
    const baseAng = this.facing - 0.4 + swingArc;
    this._drawSingleClub(ctx, baseAng, 40, 1.05);
    // wrap on shaft - tape near grip
    const gripX = this.x + Math.cos(baseAng - 0.3) * (this.r * 0.7);
    const gripY = this.y + Math.sin(baseAng - 0.3) * (this.r * 0.7);
    ctx.strokeStyle = '#5a2520';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(gripX + Math.cos(baseAng) * 9, gripY + Math.sin(baseAng) * 9);
    ctx.lineTo(gripX + Math.cos(baseAng) * 14, gripY + Math.sin(baseAng) * 14);
    ctx.stroke();
    ctx.lineCap = 'butt';
  }

  _drawDualClubs(ctx) {
    // active swing arm
    const swingArc = this.swing > 0 ? Math.sin((1 - this.swing) * Math.PI) * 2.2 - 1.1 : 0;
    const sideSign = this.dualSide ? 1 : -1;
    const activeAng = this.facing - 0.4 * sideSign + swingArc * sideSign;
    const idleAng = this.facing - 0.4 * (-sideSign);
    // idle arm offset slightly back
    const idleResting = idleAng + 0.5 * (-sideSign);
    // Draw idle club first (behind), then active
    this._drawSingleClub(ctx, idleResting, 22, 0.85);
    this._drawSingleClub(ctx, activeAng, 22, 1);
  }

  _drawHeldClubs(ctx) {
    // Two short stub clubs in hands when not throwing.
    // When throwing (throwArm > 0), one arm is extended forward.
    const throwBoost = this.throwArm;
    // back hand - short club ready
    const backAng = this.facing - 0.7;
    const backX = this.x + Math.cos(backAng) * (this.r * 0.6);
    const backY = this.y + Math.sin(backAng) * (this.r * 0.6);
    const backTipX = backX + Math.cos(backAng - 0.5) * 9;
    const backTipY = backY + Math.sin(backAng - 0.5) * 9;
    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(backX, backY);
    ctx.lineTo(backTipX, backTipY);
    ctx.stroke();
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(backX, backY);
    ctx.lineTo(backX + Math.cos(backAng - 0.5) * 3, backY + Math.sin(backAng - 0.5) * 3);
    ctx.stroke();

    // front (throwing) hand
    const forwardAng = this.facing + (throwBoost > 0 ? 0 : 0.5);
    const reach = this.r * 0.6 + throwBoost * 6;
    const frontX = this.x + Math.cos(forwardAng) * reach;
    const frontY = this.y + Math.sin(forwardAng) * reach;
    if (throwBoost < 0.7) {
      // club in hand only when not in mid-throw release
      const frontTipX = frontX + Math.cos(forwardAng - 0.3) * 9;
      const frontTipY = frontY + Math.sin(forwardAng - 0.3) * 9;
      ctx.strokeStyle = '#3a2510';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(frontX, frontY);
      ctx.lineTo(frontTipX, frontTipY);
      ctx.stroke();
      ctx.strokeStyle = '#1a0f06';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(frontX, frontY);
      ctx.lineTo(frontX + Math.cos(forwardAng - 0.3) * 3, frontY + Math.sin(forwardAng - 0.3) * 3);
      ctx.stroke();
    } else {
      // motion smear at hand - club already released
      ctx.strokeStyle = `rgba(200, 200, 220, ${(throwBoost - 0.7) * 1.5})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(frontX, frontY);
      ctx.lineTo(frontX + Math.cos(forwardAng) * 8, frontY + Math.sin(forwardAng) * 8);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }
}

// ==================== PROJECTILE ====================
class Projectile {
  constructor(x, y, target, dmg, facing) {
    this.x = x; this.y = y;
    this.startX = x; this.startY = y;
    const dx = target.x - x, dy = target.y - y;
    const d = Math.max(1, Math.hypot(dx, dy));
    const speed = 380;
    this.vx = (dx / d) * speed;
    this.vy = (dy / d) * speed;
    this.maxRange = 280;
    this.dmg = dmg;
    this.dead = false;
    this.rot = facing;
    this.spin = 18;
    this.facing = facing;
    this.r = 5;
    this.life = 0;
  }
  update(dt) {
    if (this.dead) return;
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.rot += this.spin * dt;
    this.life += dt;

    const traveled = Math.hypot(this.x - this.startX, this.y - this.startY);
    if (traveled > this.maxRange) { this.dead = true; return; }
    if (this.x < -10 || this.x > W + 10 || this.y < -10 || this.y > PLAY_BOTTOM + 10) {
      this.dead = true; return;
    }

    for (const e of state.enemies) {
      if (e.dead) continue;
      if (dist2(this.x, this.y, e.x, e.y) < e.r + this.r) {
        e.hp -= this.dmg;
        e.hurtFlash = 1;
        e.knockX += this.vx * 0.32;
        e.knockY += this.vy * 0.32;
        for (let i = 0; i < 9; i++) {
          state.particles.push({
            x: e.x + rand(-3, 3), y: e.y + rand(-3, 3),
            vx: rand(-90, 90), vy: rand(-110, -10),
            life: rand(0.3, 0.6), maxLife: 0.6,
            color: e.bloodColor, size: rand(1.2, 2.5), realtime: true,
          });
        }
        state.shake = Math.max(state.shake, 2.5);
        this.dead = true;
        return;
      }
    }
  }
  draw(ctx) {
    if (this.dead) return;
    // motion trail
    ctx.strokeStyle = 'rgba(180, 160, 130, 0.45)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(this.x - this.vx * 0.025, this.y - this.vy * 0.025);
    ctx.lineTo(this.x, this.y);
    ctx.stroke();

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);

    // shadow under projectile (fixed in world but rotated approximation - small enough)
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(0, 6, 6, 1.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // shaft
    ctx.strokeStyle = '#3a2510';
    ctx.lineWidth = 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(5, 0);
    ctx.stroke();
    ctx.strokeStyle = '#6b4a20';
    ctx.lineWidth = 0.9;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(5, 0);
    ctx.stroke();
    // grip
    ctx.strokeStyle = '#1a0f06';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(-3, 0);
    ctx.stroke();
    // blade
    ctx.strokeStyle = '#2a1a08';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(5, 0);
    ctx.lineTo(8, 4);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.restore();
  }
}

// ==================== SPRAY BULLET ====================
