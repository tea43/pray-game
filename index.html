<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-RAY: The Game</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0604;
    overflow: hidden;
  }
  #menuVideo {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.35) saturate(0.55);
    /* stay below static canvas in normal stacking (negative z keeps it behind body bg too,
       so body bg must be transparent when video should show) */
    z-index: 0;
    pointer-events: none;
    display: none;
  }
  canvas {
    display: block;
    cursor: crosshair;
    /* relative positioning gives z-index effect without disrupting Phaser's size management */
    position: relative;
    z-index: 1;
    background: transparent;
  }
</style>
</head>
<body>
<video id="menuVideo" loop muted playsinline></video>
<script type="module" src="/src/phaser/game.js"></script>
</body>
</html>
