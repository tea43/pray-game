<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Diamond / frame structure -->
  <polygon points="32,6 56,32 32,58 8,32" stroke="#c8b890" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner diamond -->
  <polygon points="32,16 48,32 32,48 16,32" stroke="#a0b0c0" stroke-width="2" stroke-linejoin="round"/>
  <!-- Cross braces -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#c8b890" stroke-width="1.5" opacity="0.5"/>
  <line x1="8" y1="32" x2="56" y2="32" stroke="#c8b890" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner reinforcement circles -->
  <circle cx="32" cy="6" r="3" stroke="#c8b890" stroke-width="1.5"/>
  <circle cx="56" cy="32" r="3" stroke="#c8b890" stroke-width="1.5"/>
  <circle cx="32" cy="58" r="3" stroke="#c8b890" stroke-width="1.5"/>
  <circle cx="8" cy="32" r="3" stroke="#c8b890" stroke-width="1.5"/>
</svg>
