<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Helmet dome -->
  <path d="M10 36 Q10 12 32 10 Q54 12 54 36 Z" stroke="#c8b890" stroke-width="2"/>
  <!-- Helmet brim -->
  <rect x="8" y="34" width="48" height="6" rx="3" stroke="#c8b890" stroke-width="2"/>
  <!-- Visor slit -->
  <rect x="16" y="37" width="32" height="2" rx="1" stroke="#c8b890" stroke-width="1.5"/>
  <!-- Center ridge -->
  <line x1="32" y1="10" x2="32" y2="34" stroke="#c8b890" stroke-width="1.5" opacity="0.6"/>
  <!-- Cheek guards -->
  <path d="M10 40 Q10 50 16 52" stroke="#c8b890" stroke-width="2" stroke-linecap="round"/>
  <path d="M54 40 Q54 50 48 52" stroke="#c8b890" stroke-width="2" stroke-linecap="round"/>
</svg>
